# The example sentences a catalogue answer offers. `search.catalogue.examples`
# loads this file, and `python -m search.catalogue.job` publishes the lines
# that pass its check.
#
# Each line is a template with one `{place}` slot, the StatVar search must
# resolve it to, and a default country. The StatVar is what the sentence
# names, checked against its graph name; a sentence that names a family of
# CRS purpose codes, such as humanitarian aid, pins a member of that family.
# A StatVar from the coverage index names the `role` its place fills (`donor`
# or `recipient`); any other StatVar must be a base variable in the origin
# catalogue. Those two artifacts say where the StatVar has data, and the
# template is offered only there.
#
# The job runs each template through the search engine at its default place,
# and at Tuvalu and Georgia where the StatVar has data there. A line passes
# when every run returns a definite part whose StatVars include `stat_var`
# and whose observations preview has points.

[[example]]
template = "Net bilateral ODA for education to {place}"
stat_var = "Amount_FinancialFlow_Net_Disbursement_CRSTypeOfFlow10_CRSTypeOfFinance110_CRSPurposeCode11110_Nominal"
role = "recipient"
place = "country/KEN"

[[example]]
template = "Latest imputed multilateral aid for health to {place}"
stat_var = "AttributedAmount_FinancialFlow_Gross_Disbursement_CRSTypeOfFlow10_DAC2aAidType106_CRSPurposeCode12110_Nominal"
role = "recipient"
place = "country/NGA"

[[example]]
template = "{place}'s total debt service since 2020"
stat_var = "Amount_FinancialFlow_ServicingPayment_Nominal"
role = "recipient"
place = "country/GHA"

[[example]]
template = "{place}'s interest payments on PPG external debt"
stat_var = "Amount_FinancialFlow_InterestPayment_PublicOrPubliclyGuaranteed_Nominal"
role = "recipient"
place = "country/KEN"

[[example]]
template = "GDP growth in {place}"
stat_var = "GrowthRate_Amount_EconomicActivity_GrossDomesticProduction"
place = "country/NGA"

[[example]]
template = "Inward remittances to {place}"
stat_var = "Amount_Remittance_InwardRemittance"
place = "country/ZAF"
