# The example sentences a catalogue answer offers. `search.catalogue.examples`
# loads this file, and `python -m search.catalogue.job` publishes the lines
# that pass its check.
#
# Each line is a template with one `{place}` slot, the StatVar search must
# resolve it to, and a default country. The StatVar is what the sentence
# names, checked against its graph name; a sentence that names a family of
# CRS purpose codes, such as health aid, pins a member of that family.
# A StatVar from the coverage index names the `role` its place fills (`donor`
# or `recipient`); any other StatVar must be a base variable in the origin
# catalogue. Those two artifacts say where the StatVar has data, and the
# template is offered only there.
#
# The job runs each template through the search engine at its default place,
# and at Tuvalu and Georgia where the StatVar has data there. A line passes
# when every run returns a definite part whose StatVars include `stat_var`
# and whose observations preview has points, and the answer carries no
# departure that says it answers another question than the sentence asked
# (`search.catalogue.check.REFUSING_DEPARTURES`). A sentence that names a
# measure, direction or breakdown the engine drops, or a place without values,
# does not pass; the data-describing departures (modelled values, a group read
# as its members, a place read in the one direction holding data, a check
# covering only some values) do.

[[example]]
template = "ODA to {place} since 2015"
stat_var = "Amount_FinancialFlow_Gross_Disbursement_DAC2aAidType206_Nominal"
role = "recipient"
place = "country/UGA"

[[example]]
template = "Humanitarian aid to {place}"
stat_var = "Amount_FinancialFlow_Gross_Disbursement_DAC2aAidType216_Nominal"
role = "recipient"
place = "country/SOM"

[[example]]
template = "{place}'s debt service on PPG external debt"
stat_var = "Amount_FinancialFlow_ServicingPayment_PublicOrPubliclyGuaranteed_Nominal"
role = "recipient"
place = "country/MOZ"

[[example]]
template = "{place}'s GDP per capita"
stat_var = "Amount_EconomicActivity_GrossDomesticProduction_Nominal_PerCapita"
place = "country/RWA"

[[example]]
template = "Life expectancy in {place}"
stat_var = "LifeExpectancy_Person"
place = "country/KEN"

[[example]]
template = "GDP growth in {place}"
stat_var = "GrowthRate_Amount_EconomicActivity_GrossDomesticProduction"
place = "country/NGA"
