      entities: [{text: Kenya, role_text: to}]
  why: The union of 13010 or 130 with 130 is 130; "population policies" reaches 13010 or 130 through the candidate menu, so the model's choice decides, and "population" must not read as a type of finance.
  tags: {theme: health, entity: country, direction: destination_only, unit: default, time: range, operation: union, breakdown: sector, door: parsed, phrasing: technical, probe: [sector_binding]}
  expect:
    definite:
      measure: {family: crs.disbursement_gross, bound: {crsTypeOfFlow: CRSTypeOfFlow10, crsPurpose: CRSPurposeCode130}}
      entities: [{dcid: country/KEN, role: destination}]
      window: {kind: range, start: 2010, end: 2024}

