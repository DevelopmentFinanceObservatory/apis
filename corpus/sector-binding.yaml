# Sector binding: a phrase that restricts a CRS answer is applied or refused, never dropped,
# broadened or narrowed. Each parsed case sends the part as data-mcp sends it: the variable phrase,
# the CRS provenance, the window 2010 to 2024, and Kenya as recipient where the query names it.
#
# Each expectation is the outcome under the default qualifier_coverage=refuse. A known_failure marks
# a case whose answer differs on the current engine; the comment above it names the behaviour that
# fixes it.
# Not assertable here: which phrase a refusal names, a qualifier record's evidence, and the
# operation (union or refinement) behind a set binding. The why line states them.

- id: sb-reproductive-health
  query: reproductive health ODA gross disbursements
  door: parsed
  parsed:
    - variable_text: reproductive health ODA gross disbursements
      time_text: 2010 to 2024
      provenance: provenance/OECDCreditorReportingSystem
  why: By convention "reproductive health" is CRS sector 130, so the answer binds 130 for the whole phrase.
  tags: {theme: health, entity: none, direction: none, unit: default, time: range, operation: none, breakdown: sector, door: parsed, phrasing: technical, probe: [sector_binding]}
  expect:
    definite:
      measure: {family: crs.disbursement_gross, bound: {crsTypeOfFlow: CRSTypeOfFlow10, crsPurpose: CRSPurposeCode130}}
      entities: []
      window: {kind: range, start: 2010, end: 2024}

