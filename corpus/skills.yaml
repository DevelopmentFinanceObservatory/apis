- id: skills-grant-equivalent-france
  query: grant equivalent ODA from France
  why: Grant equivalent ODA from France is a donor total, which DAC1 answers with total ODA, and it matches skills through the measuredProperty shape anchor.
  tags:
    feature: skills
    directional_flow: na
    conjunction: none
  expect:
    definite:
      measure:
        shape:
          population_type: FinancialFlow
          measured_property: grantEquivalent
          stat_type: measuredValue
          measurement_qualifier: Nominal
          measurement_denominator: null
        bound:
          dac1AidType: DAC1AidType1010
          financialFlowType: Disbursement
      entities:
      - dcid: country/FRA
        role: origin
      skills:
        present: true
- id: skills-refugee-costs-donor-countries
  query: refugee costs in donor countries ODA
  why: A donor total with no recipient answers from DAC1's in-donor refugee costs. No skill attaches to DAC1 series, so the case leaves skills unchecked.
  tags:
    feature: skills
    directional_flow: na
    conjunction: none
  expect:
    definite:
      measure:
        family: dac1.in_donor_refugee_costs
      entities: []
- id: skills-oda-loans-japan
  query: ODA loans by Japan
  why: ODA loans by Japan names no recipient, so DAC1's donor totals answer it with ODA non-grant disbursements. No skill attaches to DAC1 series, so the case leaves skills unchecked.
  tags:
    feature: skills
    directional_flow: na
    conjunction: none
  known_failure: {issue: 1241, checks: [measure]}
  expect:
    definite:
      measure:
        family: dac1.disbursement_gross
        bound:
          dac1AidType: DAC1AidType1010
          dacTypeOfFinance: DACTypeOfFinanceNonGrants
      entities:
      - dcid: country/JPN
        role: origin
- id: skills-humanitarian-aid-united-kingdom
  query: humanitarian aid from the United Kingdom
