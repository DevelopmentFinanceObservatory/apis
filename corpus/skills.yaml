- id: skills-grant-equivalent-france
  query: grant equivalent ODA from France
  why: Grant equivalent ODA from France matches skills through the measuredProperty shape anchor and through the CRS source attachment.
  tags:
    feature: skills
    directional_flow: na
    conjunction: none
  expect:
    definite:
      measure:
        shape:
          population_type: FinancialFlow
          measured_property: grantEquivalent
          stat_type: measuredValue
          measurement_qualifier: Nominal
          measurement_denominator: null
        bound:
          crsTypeOfFlow: CRSTypeOfFlow10
          financialFlowType: Disbursement
      entities:
      - dcid: country/FRA
        role: origin
      skills:
        present: true
