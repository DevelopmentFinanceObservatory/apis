- id: rep-uk-health-tanzania
  query: UK health aid in Tanzania
  why: '"Health" binds CRS 120 and 130 together, and a sector part reads CRS gross disbursements from the UK to Tanzania on every run.'
  tags:
    {
      theme: health,
      entity: two_roles,
      direction: both,
      unit: default,
      time: none,
      operation: none,
      breakdown: sector,
      door: raw_text,
      phrasing: casual,
      probe: [stability],
    }
  repeat: 5
  expect:
    definite:
      measure:
        family: crs.disbursement_gross
        bound:
          crsTypeOfFlow: CRSTypeOfFlow10
          crsPurpose: [CRSPurposeCode120, CRSPurposeCode130]
      entities:
        [
          { dcid: country/GBR, role: origin },
          { dcid: country/TZA, role: destination },
        ]

