- id: rep-germany-oda-gni
  query: Germany ODA and GNI from 2015 to 2022
  why: Germany's ODA reads the OECD headline total ODA and its GNI the DAC1 series, both from 2015 to 2022, on every run.
  tags:
    {
      theme: aid,
      entity: country,
      direction: origin_only,
      unit: default,
      time: range,
      operation: none,
      breakdown: none,
      door: raw_text,
      phrasing: casual,
      probe: [stability],
    }
  repeat: 5
  expect:
    parts:
      - definite:
          measure:
            family: dac1.disbursement_net
            bound: { dac1AidType: DAC1AidType1010 }
          provenance: { dataset: provenance/ONEOECDHeadlineODA, bound: true }
          entities: [{ dcid: country/DEU, role: origin }]
          window: { kind: range, start: 2015, end: 2022 }
      - definite:
          measure: { family: dac1.gni }
          entities: [{ dcid: country/DEU, role: observationAbout }]
          window: { kind: range, start: 2015, end: 2022 }

