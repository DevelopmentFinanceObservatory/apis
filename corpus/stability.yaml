- id: rep-two-questions
  query: ODA from Spain to Congo and ODA from Korea to Ghana 2019
  why: Two questions answer as two parts, Spain to an ambiguous Congo refused and Korea to Ghana in 2019 from DAC2a, on every run.
  tags:
    {
      theme: aid,
      entity: two_roles,
      direction: both,
      unit: default,
      time: year,
      operation: none,
      breakdown: none,
      door: raw_text,
      phrasing: casual,
      conjunction: two_questions,
      probe: [stability],
    }
  known_failure: { issue: 1156, checks: [disposition, parts] }
  repeat: 5
  expect:
    parts:
      - no_data: { reason: entity_ambiguous }
        entities: [{ dcid: country/ESP, role: origin }]
      - definite:
          measure: { family: dac2a.oda_net_received }
          entities:
            [
              { dcid: country/KOR, role: origin },
              { dcid: country/GHA, role: destination },
            ]
          window: { kind: range, start: 2019, end: 2019 }

