  tags: {theme: debt, entity: country, direction: destination_only, door: raw_text}
  expect:
    definite:
      measure: {family: ids.debt_stock, bound: {maturityBand: LongTermMaturity, includesIMFCredit: WithoutIMFCredit}}
      entities: [{dcid: country/KEN, role: destination}]

