# Exclusions: a stretch of the query that asks to leave something out is read beside extraction
# and blanked from every reader of the query's words. Search does not compute it: the answer is
# the wider question, disclosed. Each case asserts disposition, measure and entities. The
# departure a case carries is model-dependent, so tests/engine/test_exclusion_read.py pins it.

- id: exclusion-oda-kenya-humanitarian
  query: "ODA to Kenya excluding humanitarian aid in 2022"
  why: 'Search does not subtract humanitarian aid: it answers ODA to Kenya in one part and says the exclusion was not applied.'
  tags: {theme: aid, entity: country, direction: destination_only, door: raw_text}
  expect:
    definite:
      measure: {family: dac2a.oda_net_received}
      entities: [{dcid: DACOfficialDonors, role: origin}, {dcid: country/KEN, role: destination}]

- id: exclusion-oda-kenya-not-united-states
  query: "ODA to Kenya in 2022 not from the United States"
  why: 'The left-out donor reaches no field, so the origin stays the official donors total, never the United States.'
  tags: {theme: aid, entity: country, direction: destination_only, door: raw_text}
  expect:
    definite:
      measure: {family: dac2a.oda_net_received}
      entities: [{dcid: DACOfficialDonors, role: origin}, {dcid: country/KEN, role: destination}]

- id: exclusion-oda-africa-except-kenya
  query: "ODA to Africa except Kenya in 2022"
  why: 'Africa binds the DACAfrica total, which cannot subtract a member, so the answer is Africa and the exclusion is disclosed.'
  tags: {theme: aid, entity: group, direction: destination_only, door: raw_text}
  expect:
    definite:
      measure: {family: dac2a.oda_net_received}
      entities: [{dcid: DACOfficialDonors, role: origin}, {dcid: DACAfrica, role: destination}]

