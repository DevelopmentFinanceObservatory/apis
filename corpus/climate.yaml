- id: climate-adaptation-fund-viet-nam
  query: Adaptation Fund adaptation finance to Viet Nam in 2022
  why: '"Adaptation" reads ONE Data''s adaptation-only part, since a project marked for both objectives counts as cross-cutting.'
  tags: {theme: climate, entity: organisation, direction: both, unit: default, time: year, operation: none, breakdown: objective, door: raw_text, phrasing: casual}
  expect:
    definite:
      measure:
        family: [climate.disbursement_gross, climate.commitment]
        bound: {climatePolicyObjective: AdaptationOnlyClimateChangePolicyObjective}
      entities: [{dcid: AdaptationFund, role: origin}, {dcid: country/VNM, role: destination}]
      window: {kind: range, start: 2022, end: 2022}
      operations: []

