# Admitted upstream sources. Adding or removing a source is a pull request to
# this file, and `origin_catalogue.registry` validates it.
#
# [[base]]: a base Data Commons Source node.
#   source            the dc/s/* dcid
#   label             display name (the graph's `name`, except where noted)
#   exclusions        provenances not admitted, each with a reason. An empty
#                     list records that overlap with DFO was reviewed
#                       superseded_by_dfo: an upstream copy of something DFO
#                       imports
#                       superseded_by_un_system: the series of `successor`, a
#                       [[un_system]] provenance, replace it. A variable of
#                       the provenance is `<variable_prefix><code>` with an
#                       optional `<code_delimiter><pairs>`, its constraint
#                       pairs joined by `pair_delimiter`, each a dimension
#                       and value joined by `value_delimiter`. Its successor
#                       is the agency's variable of the same code and the
#                       same pairs in any order
#   country           a national source's country
#   scan_type         the place type where the source's series sit, scanned
#                     inside `country` at any depth, or everywhere when the
#                     entry names no country
#
# [[un_system]]: a UN agency on the UN System Data Commons.
#   provenance        the undata/p/* agency provenance, also its source
#   segment           the id segment in undata/<segment>/... and
#                     undata/topic/<segment>/...
#   label             display name
#   exclusions        series not admitted, each undata/<segment>/SERIES-<code>
#                     with reason superseded_by_dfo and `dfo_provenance`, the
#                     DFO provenance holding the data the series derives from
#
# [[alias]]: other names users write for a source, where the catalogue's own
# names do not yield them. Search matches a source mention's words against
# both, ignoring case, punctuation and a leading "the". A parenthesised
# abbreviation in a catalogue name, such as "(IDS)", needs no alias when its
# letters are the initials of the capitalised words before it.
# An alias name replaces any key the catalogue's own names derive from the
# same words, so a word the catalogue gives to several unrelated sources
# (WHO) resolves to the alias.
#   refs              one or more references, each a provenance, a dc/d/*
#                     Dataset or a Source, none written twice. Several make a
#                     collection standing for all of them, labelled with the
#                     first name. A ref the catalogue does not admit is left
#                     out, and an alias with none left is skipped
#   names             the other names, none blank or written twice in the
#                     file, ignoring case and extra whitespace

