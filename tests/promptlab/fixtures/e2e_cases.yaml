# Trimmed copies of maternal-mortality, synth-tb-incidence-ethiopia and sdg-04 from corpus/sdg.yaml, for the offline e2e-cell tests.
- id: maternal-mortality
  query: maternal mortality ratio
  why: Maternal mortality ratio with no place resolves to sdg/SH_STA_MORT.SEX--F; the word ratio pins the SDG rate over the raw count.
  tags:
    directional_flow: na
    conjunction: none
  expect:
    definite:
      measure:
        shape:
          population_type: SDG_SH_STA_MORT
          measured_property: value
          stat_type: measuredValue
          measurement_qualifier: null
          measurement_denominator: null
        bound:
          sdg_sex: SDG_SexEnum_F
        stat_vars: [sdg/SH_STA_MORT.SEX--F]
      entities: []
- id: synth-tb-incidence-ethiopia
  query: tuberculosis incidence rate in Ethiopia
  why: Tuberculosis incidence rate in Ethiopia resolves to sdg/SH_TBS_INCD.
  tags:
    directional_flow: na
    conjunction: none
  expect:
    definite:
      measure:
        shape:
          population_type: SDG_SH_TBS_INCD
          measured_property: value
          stat_type: measuredValue
          measurement_qualifier: null
          measurement_denominator: null
        stat_vars:
        - sdg/SH_TBS_INCD
      entities:
      - dcid: country/ETH
        role: observationAbout
- id: sdg-04
  query: HIV incidence rate Kenya
  why: HIV incidence rate in Kenya resolves to the bare aggregate sdg/SH_HIV_INCD, with the sex-disaggregated
    siblings inside that one reading.
  tags:
    directional_flow: na
    conjunction: none
  expect:
    definite:
      measure:
        shape:
          population_type: SDG_SH_HIV_INCD
          measured_property: value
          stat_type: measuredValue
          measurement_qualifier: null
          measurement_denominator: null
        open:
        - sdg_sex
        stat_vars:
        - sdg/SH_HIV_INCD
      entities:
      - dcid: country/KEN
        role: observationAbout
