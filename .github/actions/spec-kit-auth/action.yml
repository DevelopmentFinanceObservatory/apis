name: Authenticate git for the dfo-spec-kit dependency
description: >-
  Mint a read-only dfo-reader App token for ONEcampaign/dfo-spec-kit and
  rewrite ONEcampaign git URLs to carry it, so uv can resolve the private
  dfo-spec-kit git dependency. The token is also an output, for a checkout or
  a Docker build secret that needs it directly.
inputs:
  client-id:
    description: The dfo-reader App client ID (vars.READER_APP_CLIENT_ID)
    required: true
  private-key:
    description: The dfo-reader App private key (secrets.READER_APP_PRIVATE_KEY)
    required: true
outputs:
  token:
    description: Installation token with read access to ONEcampaign/dfo-spec-kit only
    value: ${{ steps.token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Mint a dfo-spec-kit read token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ONEcampaign
        repositories: dfo-spec-kit
        permission-contents: read

    # Scoped to ONEcampaign URLs, so the token never travels with a fetch
    # from any other owner.
    - name: Configure git credential rewrite
      shell: bash
      run: git config --global url."https://x-access-token:${SPEC_KIT_TOKEN}@github.com/ONEcampaign/".insteadOf "https://github.com/ONEcampaign/"
      env:
        SPEC_KIT_TOKEN: ${{ steps.token.outputs.token }}
