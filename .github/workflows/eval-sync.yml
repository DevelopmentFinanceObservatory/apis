name: Eval sync

# Mirrors corpus/ to Langfuse after a push to dev: one dataset per case file,
# search-<stem>, with one item per case and the items of removed cases archived
# (python -m search.eval.sync). A dataset_resubmit case's request is built
# against the served graph release, which the job opens as the eval reader
# account.

on:
  push:
    branches: [dev]
    paths: ["corpus/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-sync
  cancel-in-progress: false

env:
  UV_SYNC_ARGS: --frozen --extra eval --extra api --extra engine --extra datasets --extra graph
  UV_NO_SYNC: "1"

jobs:
  sync:
    name: Eval sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync ${{ env.UV_SYNC_ARGS }} --no-default-groups

      # A dataset_resubmit case's request is built against the deployed graph
      # release bucket.
      - name: Authenticate to Google Cloud as the eval reader
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.EVAL_WIF_PROVIDER }}
          service_account: ${{ secrets.EVAL_WIF_SA }}

      # search.eval.sync loads the engine, whose settings require
      # SEARCH_GRAPH_BASE.
      - name: Sync the case files to Langfuse
        env:
          SEARCH_GRAPH_BASE: ${{ vars.SEARCH_GRAPH_BASE }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          GRAPH_RELEASE_URI: ${{ vars.GRAPH_RELEASE_URI }}
        run: uv run python -m search.eval.sync
