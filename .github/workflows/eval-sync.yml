name: Eval sync

# Mirrors corpus/ to Langfuse after a push to dev: one dataset per case file,
# search-<stem>, with one item per case and the items of removed cases archived
# (python -m search.eval.sync). Only the items Langfuse lacks or holds
# differently are written. An item's input is the case's request as its file
# authors it, so the sync reads no graph release and needs no Google Cloud
# credentials.

on:
  push:
    branches: [dev]
    paths: ["corpus/**"]
  workflow_dispatch:

permissions:
  contents: read

# Shared with eval-nightly.yml: both write the Langfuse datasets, and a sync
# during the nightly would change the item inputs its push checks.
concurrency:
  group: eval-langfuse
  cancel-in-progress: false
  # Keeps every pending run in order. By default a group holds one pending run,
  # and a newer one cancels it, so a corpus sync could drop a waiting nightly.
  queue: max

env:
  UV_SYNC_ARGS: --frozen --extra eval --extra api --extra engine --extra datasets --extra graph
  UV_NO_SYNC: "1"

jobs:
  sync:
    name: Eval sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync ${{ env.UV_SYNC_ARGS }} --no-default-groups

      # search.eval.sync loads the engine, whose settings require
      # SEARCH_GRAPH_BASE.
      - name: Sync the case files to Langfuse
        env:
          SEARCH_GRAPH_BASE: ${{ vars.SEARCH_GRAPH_BASE }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          # The project the Langfuse keys must name; the sync refuses any other.
          LANGFUSE_PROJECT_ID: ${{ vars.LANGFUSE_PROJECT_ID }}
        run: uv run python -m search.eval.sync
