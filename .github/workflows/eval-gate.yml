name: Eval gate

# Paired Search eval for a pull request. Head is the PR merge commit that
# actions/checkout fetches; base is its first parent, the base branch as the
# merge would land on it. The changes job decides whether the PR touches
# anything the eval reads. The run job is a matrix of EVAL_SHARDS shards on
# parallel runners. Each shard builds an environment in each tree, stages the
# deployed graph release and origin catalogue build
# (scripts/stage_eval_data.py, read as the eval reader service account),
# migrates one Postgres database per tree with that tree's dataset_store
# migrations, serves both trees with the
# eval profile and the Datasets surface on two ports, and runs
# scripts/eval_paired.py --shard K/N over the
# eligible cases in corpus/ whose id hashes to K, with at most
# EVAL_CONCURRENCY posts in flight per app. Each in-flight request holds one of
# the 6 workers in a 2-core runner's default thread pool while the engine
# materialises, and at 6 posts per app heavy CRS requests stalled together
# into the engine's 45 s timeout (HTTP 504) on both apps. 3 posts per app keep
# them clear of it. Four shards finish in about 6 to 11 minutes.
# Each shard uploads its JSON report, every response body, both app logs and
# its exit code as the `eval-gate-<K>` artifact, and writes its Markdown
# summary to its own job summary. Nothing here writes to Langfuse.
#
# Every case calls Gemini, so the eval runs when a non-draft PR is opened or
# reopened and when a draft is marked ready for review. A push runs nothing.
# Every job requires a non-draft PR, so a draft's opened or reopened run skips
# them all; a draft cannot merge, and marking it ready runs the eval on its
# head. Adding the `run-eval` label asks for another run, draft or not:
# eval-request.yml removes the label and dispatches this workflow on the PR's
# head branch with the PR number as the `pr` input. A dispatched run reports
# its checks on that branch's latest commit, the PR head, and checks out
# refs/pull/<pr>/merge, the merge commit a pull_request run reads. The changes
# job fails when that merge commit's second parent is not the commit the run
# reports on, as happens when GitHub has not yet rebuilt the merge ref after a
# push. A label event never starts this workflow, so no label can replace a
# commit's `Eval gate` result.
#
# eval_paired.py exits 0 when nothing blocks, 1 on a blocking verdict and 3 on
# infrastructure. Each shard writes that code to the `code` file in its
# artifact and passes; any other code is a crash and fails the shard. The
# verdict job reads every shard's code and combines them: 1 if any shard
# exited 1, else 3 if any exited 3, else 0. It fails on a combined 1 or 3
# unless the PR carries the `eval-override` label. The verdict job reads the
# labels when it runs, so adding the label and re-running the failed verdict
# job releases the PR without repeating the eval.
#
# The `eval-override` label releases one commit. The reset job removes it at the
# start of every run, before the verdict job reads it, so a label applied to
# release a run stays for that run only. The reset job runs no PR code.
#
# The path check runs in a job the verdict job needs, so a PR that touches
# nothing the eval reads still reports a passing check.

on:
  pull_request:
    branches: [dev, main]
    # `synchronize` is omitted so a push spends no Gemini calls. `edited` is
    # omitted because a skipped check on a commit would replace the failed one
    # (see the hazard recorded in ci.yml), and `labeled` for the same reason:
    # eval-request.yml handles the `run-eval` label.
    types: [opened, reopened, ready_for_review]
  # Dispatched by eval-request.yml on the PR's head branch.
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the pull request to evaluate
        required: true
        type: number

permissions:
  contents: read

# One group per PR across both triggers, so a newer eval cancels an older one.
# The expression is PR_NUMBER's, since workflow concurrency cannot read env.
concurrency:
  group: eval-gate-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  # The PR under evaluation, on either trigger.
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
  UV_SYNC_ARGS: --frozen --extra eval --extra api --extra engine --extra datasets --extra graph
  UV_NO_SYNC: "1"
  # The deployed artifact roots, owned by the `apis` stack in `infra`. The eval
  # reader service account reads these buckets and nothing else.
  DEPLOYED_RELEASE_URI: gs://dfo-dev-graph-release-dev-fin-observatory/
  DEPLOYED_CATALOGUE_URI: gs://dfo-dev-origin-catalogue-dev-fin-observatory/
  HEAD_PORT: "8100"
  BASE_PORT: "8101"
  # The run job's shard count, and the posts each shard keeps in flight per app.
  EVAL_SHARDS: "4"
  EVAL_CONCURRENCY: "3"

jobs:
  # Removes the eval-override label so it releases only the commit it was applied
  # to. Runs no PR code and checks nothing out.
  reset:
    name: Reset the eval override
    # The eval reads dev's deployed builds and calls Gemini with the
    # repository's secrets, which a fork PR does not receive, so every job
    # skips on a fork PR. Every job also skips on a draft. A dispatched run has
    # no pull_request payload and passes both clauses.
    if: github.event.pull_request.draft != true && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the eval-override label
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/labels
        run: |
          set -euo pipefail
          if gh api "$LABELS" --jq '.[].name' | grep -qx 'eval-override'; then
            gh api --method DELETE "$LABELS/eval-override" > /dev/null
            echo "Removed the \`eval-override\` label; a new commit needs a new override." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Runs the path filter once for every shard and lists the shards.
  changes:
    name: Detect eval changes
    # The run job needs this one, so it skips with it.
    if: github.event.pull_request.draft != true && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      eval: ${{ steps.filter.outputs.eval }}
      merge: ${{ steps.merge.outputs.sha }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its parents: HEAD^1 is the base. A
          # pull_request run checks out the event's merge commit; a dispatched
          # run reads the PR's merge ref as it stands.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', env.PR_NUMBER) || '' }}
          fetch-depth: 2
          persist-credentials: false

      # The run reports on HEAD_SHA, so it must evaluate a merge of that commit.
      # A PR that conflicts with its base keeps a stale merge ref, or none, in
      # which case the checkout above fails first.
      # The run job checks out this same merge commit by its sha.
      - name: Check the merge commit
        id: merge
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          merged="$(git rev-parse HEAD^2)"
          if [ "$merged" != "$HEAD_SHA" ]; then
            echo "::error::refs/pull/$PR_NUMBER/merge merges $merged, not the head $HEAD_SHA. Either GitHub has not rebuilt the merge ref since the last push, so add the run-eval label again in a minute, or the PR conflicts with its base and GitHub cannot build one, so resolve the conflict first."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect eval-relevant changes
        id: filter
        run: |
          set -euo pipefail
          pattern='^(src/|packages/|corpus/|scripts/eval_|scripts/stage_eval_data\.py$|uv\.lock$|pyproject\.toml$|\.github/workflows/eval-(gate|nightly|sync)\.yml$)'
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "Changed paths:"
          echo "$changed"
          if grep -qE "$pattern" <<< "$changed"; then
            echo "eval=true" >> "$GITHUB_OUTPUT"
          else
            echo "eval=false" >> "$GITHUB_OUTPUT"
            echo "Eval skipped: no eval-relevant changes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Note changes to the eval itself
        if: steps.filter.outputs.eval == 'true'
        run: |
          set -euo pipefail
          pattern='^(src/search/eval/|scripts/eval_|scripts/stage_eval_data\.py$|corpus/families/|\.github/workflows/eval-(gate|nightly|sync)\.yml$)'
          touched="$(git diff --name-only HEAD^1 HEAD | grep -E "$pattern" || true)"
          if [ -n "$touched" ]; then
            {
              echo "This PR changes the eval itself; the gate ran the PR's own eval code."
              echo
              while IFS= read -r path; do echo "- \`$path\`"; done <<< "$touched"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The run job's matrix: [{"index": 1, "label": "1/4"}, ...].
      - name: List the shards
        id: shards
        run: |
          set -euo pipefail
          shards="$(jq -nc --argjson n "$EVAL_SHARDS" \
            '[range(1; $n + 1) | {index: ., label: "\(.)/\($n)"}]')"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  run:
    name: Eval run (shard ${{ matrix.shard.label }})
    needs: changes
    if: >-
      needs.changes.outputs.eval == 'true' &&
      github.event.pull_request.draft != true &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    # The Datasets store both apps read, one database per tree, as in
    # migrations.yml. The checks read the members door
    # (POST /api/datasets/{id}/members), which the Datasets surface serves.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dataset_store_migrator
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dataset_store_migrator"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit the changes job checked, and its parents: HEAD^1
          # is the base.
          ref: ${{ needs.changes.outputs.merge }}
          fetch-depth: 2
          # No step needs an authenticated git after checkout.
          persist-credentials: false

      - name: Check out the base
        id: base
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/base"
          git worktree add --detach "$base_dir" HEAD^1
          echo "dir=$base_dir" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies in head and base
        env:
          BASE_DIR: ${{ steps.base.outputs.dir }}
        run: |
          set -euo pipefail
          uv sync ${{ env.UV_SYNC_ARGS }} --no-default-groups
          (cd "$BASE_DIR" && uv sync ${{ env.UV_SYNC_ARGS }} --no-default-groups)

      # The graph service admits only callers holding roles/run.invoker. The ID
      # token minted here for SEARCH_GRAPH_BASE reaches both apps as
      # DCP_ID_TOKEN, which dfo_platform.cloud_run_auth sends to every *.run.app
      # host. It lasts an hour, longer than the job's 45-minute timeout.
      - name: Authenticate to Google Cloud as the eval reader
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.EVAL_WIF_PROVIDER }}
          service_account: ${{ secrets.EVAL_WIF_SA }}
          token_format: id_token
          id_token_audience: ${{ vars.SEARCH_GRAPH_BASE }}
          id_token_include_email: true

      # Both apps refuse to start without a resolvekit cache directory. Each side
      # has its own, keyed by that tree's entity_resolution sources and lock file
      # (git tree and blob ids), so a side serves only a pack its own tree built.
      # A miss builds the pack afresh, since there is no fallback key.
      - name: Key the resolvekit caches
        id: keys
        run: |
          set -euo pipefail
          entity_resolution=packages/dfo-data-tools/src/entity_resolution
          for side in head base; do
            rev=HEAD
            if [ "$side" = base ]; then rev=HEAD^1; fi
            hash="$(git rev-parse "$rev:$entity_resolution" "$rev:uv.lock" | sha256sum | cut -c1-16)"
            echo "$side=resolvekit-$side-$hash" >> "$GITHUB_OUTPUT"
          done

      - name: Restore the head resolvekit cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/resolvekit-head
          key: ${{ steps.keys.outputs.head }}

      - name: Restore the base resolvekit cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/resolvekit-base
          key: ${{ steps.keys.outputs.base }}

      - name: Run the paired eval
        id: eval
        env:
          BASE_DIR: ${{ steps.base.outputs.dir }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEARCH_GRAPH_BASE: ${{ vars.SEARCH_GRAPH_BASE }}
          # WAF bypass for the graph: CI runner IPs are datacenter ranges the
          # graph's bot protection challenges, and this header exempts them.
          SEARCH_GRAPH_TOKEN: ${{ secrets.SEARCH_GRAPH_TOKEN }}
          DCP_ID_TOKEN: ${{ steps.gcp.outputs.id_token }}
          HEAD_RESOLVEKIT_DIR: ${{ runner.temp }}/resolvekit-head
          BASE_RESOLVEKIT_DIR: ${{ runner.temp }}/resolvekit-base
          # The eval profile: every request reaches the engine and the LLM.
          SEARCH_RESPONSE_CACHE_ENABLED: "false"
          SEARCH_LLM_MEMO_MAX_BYTES: "0"
          SEARCH_EXTRACT_STORE: "off"
          SHARD: ${{ matrix.shard.index }}
          # The Datasets surface, for its members door. Each app reads its own
          # database (DATASET_STORE_DATABASE, set per app below) as the runtime
          # role over plain TCP. The graph and SDMX roots are the graph service's
          # API, as in sdmx-live.yml. The eval reads only the members door, which
          # writes nothing, so the buckets, the worker and the task queue name
          # nothing that exists, and a write or enqueue fails.
          DFO_DATASETS_SURFACE: "1"
          DFO_PUBLIC_SITE_URL: https://eval-gate.invalid
          DATASET_STORE_HOST: localhost
          DATASET_STORE_PORT: "5432"
          DATASET_STORE_RUNTIME_DB_USER: runtime-placeholder@ci.dev
          DATASET_STORE_RUNTIME_DB_PASSWORD: ci-throwaway
          DATASETS_GRAPH_BASE_URL: ${{ vars.SEARCH_GRAPH_BASE }}/core/api
          DATASETS_SDMX_BASE_URL: ${{ vars.SEARCH_GRAPH_BASE }}/core/api
          DATASETS_GRAPH_TOKEN: ${{ secrets.SEARCH_GRAPH_TOKEN }}
          DATASETS_ARTIFACT_BUCKET_WORKING: eval-gate-no-writes
          DATASETS_ARTIFACT_BUCKET_PINNED: eval-gate-no-writes
          DFO_WORKER_URL: http://127.0.0.1:9
          DFO_WORKER_INVOKER_SERVICE_ACCOUNT: eval-gate-no-tasks@invalid.iam.gserviceaccount.com
          DFO_TASKS_QUEUE: projects/eval-gate-no-tasks/locations/none/queues/none
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/eval-gate"
          mkdir -p "$out" "$HEAD_RESOLVEKIT_DIR" "$BASE_RESOLVEKIT_DIR"

          rc=0
          staged="$(uv run python scripts/stage_eval_data.py \
            --checkout . --checkout "$BASE_DIR" --dest "$RUNNER_TEMP/eval-data" \
            --release-uri "$DEPLOYED_RELEASE_URI" \
            --catalogue-uri "$DEPLOYED_CATALOGUE_URI")" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::A format root one of the trees reads has no deployed build; see the log above."
            echo 3 > "$out/code"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          # GRAPH_RELEASE_URI and ORIGIN_CATALOGUE_URI, for both apps and the driver.
          while IFS="=" read -r name uri; do export "$name=$uri"; done <<< "$staged"

          # One database per tree, migrated by that tree's own migrations. The
          # service container has neither database nor the runtime and worker
          # roles, which migrations 0001 and 0012 grant to.
          pg() { PGPASSWORD=ci-throwaway psql -h localhost -U dataset_store_migrator \
            -d postgres -v ON_ERROR_STOP=1 -q -c "$1"; }
          pg "CREATE ROLE \"$DATASET_STORE_RUNTIME_DB_USER\" LOGIN PASSWORD '$DATASET_STORE_RUNTIME_DB_PASSWORD';"
          pg "CREATE ROLE \"worker-placeholder@ci.dev\" LOGIN;"
          pg "CREATE DATABASE datasets_head;"
          pg "CREATE DATABASE datasets_base;"
          migrate() {
            DATASET_STORE_DATABASE="$1" \
              DATASET_STORE_MIGRATOR_DB_USER=dataset_store_migrator \
              DATASET_STORE_MIGRATOR_DB_PASSWORD=ci-throwaway \
              DATASET_STORE_WORKER_DB_USER=worker-placeholder@ci.dev \
              uv run python -m dataset_store.migrate up
          }
          # Head's migrations are the PR's, so their failure fails the run. A
          # base that does not migrate is infrastructure.
          if ! migrate datasets_head; then
            echo "::error::The head tree's dataset_store migrations did not apply."
            exit 1
          fi
          if ! (cd "$BASE_DIR" && migrate datasets_base); then
            echo "::error::The base tree's dataset_store migrations did not apply."
            echo 3 > "$out/code"
            exit 0
          fi

          DATASET_STORE_DATABASE=datasets_head RESOLVEKIT_CACHE_DIR="$HEAD_RESOLVEKIT_DIR" \
            uv run uvicorn --factory \
            dfo_apis.app:create_app --host 127.0.0.1 --port "$HEAD_PORT" \
            > "$out/head-app.log" 2>&1 &
          head_pid=$!
          (cd "$BASE_DIR" && DATASET_STORE_DATABASE=datasets_base \
            RESOLVEKIT_CACHE_DIR="$BASE_RESOLVEKIT_DIR" exec uv run uvicorn \
            --factory dfo_apis.app:create_app --host 127.0.0.1 --port "$BASE_PORT") \
            > "$out/base-app.log" 2>&1 &
          base_pid=$!
          trap 'kill "$head_pid" "$base_pid" 2>/dev/null || true' EXIT

          # Both surfaces must serve: a Datasets surface that did not mount
          # would leave every members read a 404.
          wait_for_app() {
            for _ in $(seq 1 120); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$1/api/search/schema" &&
                curl -fsS -o /dev/null "http://127.0.0.1:$1/api/datasets/healthz"; then
                return 0
              fi
              if ! kill -0 "$2" 2>/dev/null; then
                break
              fi
              sleep 5
            done
            tail -n 50 "$3"
            return 1
          }
          # A head that does not serve is the PR's fault and fails the run. A
          # base that does not serve is infrastructure.
          if ! wait_for_app "$HEAD_PORT" "$head_pid" "$out/head-app.log"; then
            echo "::error::The head app did not serve /api/search/schema and /api/datasets/healthz."
            exit 1
          fi
          if ! wait_for_app "$BASE_PORT" "$base_pid" "$out/base-app.log"; then
            echo "::error::The base app did not serve /api/search/schema and /api/datasets/healthz."
            echo 3 > "$out/code"
            exit 0
          fi

          rc=0
          uv run python scripts/eval_paired.py \
            --head-url "http://127.0.0.1:$HEAD_PORT" \
            --base-url "http://127.0.0.1:$BASE_PORT" \
            --base-ref "$BASE_SHA" \
            --shard "$SHARD/$EVAL_SHARDS" \
            --concurrency "$EVAL_CONCURRENCY" \
            --report "$out/report.json" \
            --summary "$out/summary.md" \
            --responses "$out/responses.jsonl" || rc=$?
          if [ -f "$out/summary.md" ]; then
            cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A head app that died during the run is the PR's crash, and every
          # later case then read as infrastructure, which the override label
          # would release. A base app that died keeps the driver's code.
          if ! kill -0 "$head_pid" 2>/dev/null; then
            tail -n 50 "$out/head-app.log"
            echo "The head app exited during the run." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The head app exited during the run; the PR's code crashed it."
            exit 1
          fi
          if ! kill -0 "$base_pid" 2>/dev/null; then
            tail -n 50 "$out/base-app.log"
            echo "::warning::The base app exited during the run; the exit code stands."
          fi
          case "$rc" in
            0|1|3) echo "$rc" > "$out/code" ;;
            # 2 is a setup error or crash that no label releases.
            *) echo "::error::eval_paired.py exited $rc: a setup error or crash."; exit "$rc" ;;
          esac

      - name: Upload the report and responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-gate-${{ matrix.shard.index }}
          path: ${{ runner.temp }}/eval-gate/
          if-no-files-found: ignore

  verdict:
    name: Eval gate
    needs: [reset, changes, run]
    if: >-
      always() &&
      github.event.pull_request.draft != true &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check the jobs
        id: jobs
        env:
          RESET: ${{ needs.reset.result }}
          CHANGES: ${{ needs.changes.result }}
          EVAL: ${{ needs.changes.outputs.eval }}
          RUN: ${{ needs.run.result }}
        run: |
          set -euo pipefail
          # A label the reset job could not clear may belong to an earlier commit.
          if [ "$RESET" != "success" ]; then
            echo "::error::The override reset job ended with $RESET."
            exit 1
          fi
          if [ "$CHANGES" != "success" ]; then
            echo "::error::The change detection job ended with $CHANGES."
            exit 1
          fi
          if [ "$EVAL" != "true" ]; then
            echo "eval=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A shard that crashed, or whose head app died, fails the run job.
          if [ "$RUN" != "success" ]; then
            echo "::error::An eval run shard ended with $RUN; see the Eval run jobs."
            exit 1
          fi
          echo "eval=true" >> "$GITHUB_OUTPUT"

      - name: Download every shard's artifact
        if: steps.jobs.outputs.eval == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: eval-gate-*
          path: ${{ runner.temp }}/shards

      - name: Apply the combined exit code and the eval-override label
        if: steps.jobs.outputs.eval == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHARDS_DIR: ${{ runner.temp }}/shards
          LABELS: repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/labels
        run: |
          set -euo pipefail
          # 1 if any shard exited 1, else 3 if any exited 3, else 0. A shard
          # that wrote no code, or a code other than 0, 1 or 3, fails the gate.
          CODE=0
          read_codes=0
          for k in $(seq 1 "$EVAL_SHARDS"); do
            file="$SHARDS_DIR/eval-gate-$k/code"
            if [ ! -f "$file" ]; then
              echo "::error::Shard $k wrote no exit code."
              exit 1
            fi
            code="$(cat "$file")"
            read_codes=$((read_codes + 1))
            echo "Shard $k exited $code."
            case "$code" in
              1) CODE=1 ;;
              3) if [ "$CODE" = "0" ]; then CODE=3; fi ;;
              0) ;;
              *) echo "::error::Shard $k wrote the code '$code'."; exit 1 ;;
            esac
          done
          if [ "$read_codes" -eq 0 ]; then
            echo "::error::No shard code to combine; EVAL_SHARDS is '$EVAL_SHARDS'."
            exit 1
          fi
          if [ "$CODE" = "0" ]; then
            exit 0
          fi
          what="a blocking verdict"
          if [ "$CODE" = "3" ]; then
            what="an infrastructure failure"
          fi
          if gh api "$LABELS" --jq '.[].name' | grep -qx 'eval-override'; then
            echo "Eval exited $CODE ($what); the \`eval-override\` label released it." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Eval exited $CODE ($what); the eval-override label released it."
            exit 0
          fi
          echo "::error::Eval exited $CODE ($what); see the Eval run summaries. The eval-override label releases it."
          exit 1
