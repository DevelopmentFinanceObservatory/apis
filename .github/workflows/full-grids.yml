# Runs the invariant grids over their full products. On a pull request
# ci.yml runs each grid's committed covering array (tests/_covering_array.py,
# tests/engine/_grid_cells.py): every four factor values some cell holds, in
# about a twentieth of the answer grid's cells and half the cells of the role
# and pinned-resubmit read-plan grids. The standard read-plan grid has four
# factors, so its covering array is its full product and it always runs whole.
# DFO_FULL_GRIDS=1 runs every cell, which catches a fault that needs five or
# more factor values together.
#
# The nightly schedule runs the full products against dev, which covers every
# merge from the day before, so a push runs nothing. workflow_dispatch runs
# them on any branch.
#
# A failed nightly opens one issue, or comments on it when it is already open,
# with the run link and pytest's summary line. A dispatched run alerts no one.
# An I9 failure saying a door "has no door to be held to" means the door's
# answer differs from the one its request bound records. When the new answer
# is intended, re-record the bound as tests/engine/_answer_invariants_record.py
# describes.
#
# Checkout, install and test environment copy ci.yml's test-shard job.
name: Full grids

on:
  schedule:
    # 03:41 UTC daily. GitHub cron is always UTC, and a scheduled run can be
    # delayed or dropped under load.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs queue rather than cancel, so a dispatch never cancels the nightly run
# on the same branch.
concurrency:
  group: full-grids-${{ github.ref }}
  cancel-in-progress: false

env:
  # The same extras and sync behaviour as ci.yml.
  UV_SYNC_ARGS: --frozen --extra engine --extra eval --extra datasets --extra graph
  UV_NO_SYNC: "1"
  ISSUE_TITLE: "Nightly full grids: failing"

jobs:
  full-grids:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      # The vector suite comes from the exact commit pyproject.toml pins, as in
      # ci.yml.
      - name: Resolve the pinned dfo-spec-kit revision
        id: spec-kit-rev
        run: |
          rev=$(python3 - <<'PY'
          import re, sys
          text = open("pyproject.toml").read()
          match = re.search(r'^dfo-spec-kit = .*rev = "([0-9a-f]+)"', text, re.MULTILINE)
          if not match:
              sys.exit("could not resolve the dfo-spec-kit pin from pyproject.toml")
          print(match.group(1))
          PY
          )
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out the identity vector suite
        uses: actions/checkout@v7
        with:
          repository: DevelopmentFinanceObservatory/spec-kit
          ref: ${{ steps.spec-kit-rev.outputs.rev }}
          path: .spec-kit

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync ${{ env.UV_SYNC_ARGS }} --no-default-groups --group test

      - name: Run the grids over their full products
        env:
          DFO_SPEC_KIT_DIR: ${{ github.workspace }}/.spec-kit
          DFO_SPEC_KIT_REQUIRED: "1"
          DFO_FULL_GRIDS: "1"
        # bash with pipefail, so the step fails when pytest does.
        shell: bash
        run: >-
          uv run pytest -q -n auto
          tests/engine/test_answer_invariants.py
          tests/engine/test_read_plan_grid.py
          | tee "$RUNNER_TEMP/pytest.log"

      - name: Open or update the failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The nightly full grids failed on \`${GITHUB_SHA:0:9}\`."
            echo
            if [ -f "$RUNNER_TEMP/pytest.log" ]; then
              echo "Summary: \`$(grep -E '[0-9]+ (passed|failed)' "$RUNNER_TEMP/pytest.log" | tail -1)\`"
              echo
            fi
            echo "Run: $RUN_URL"
          } > "$body"
          number="$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$body"
          fi
