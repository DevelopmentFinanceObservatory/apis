name: Deploy

# The deploy steps every environment runs. deploy-dev.yml and deploy-prod.yml
# call this workflow and choose only the triggers and the GitHub Environment.
# Every project, region, registry, service, and job name comes from that
# environment's variables, so one variable name means the same thing in `dev`
# and `production`. See deploy/README.md for the full list.
#
# The `deploy` job resolves its own target commit rather than trusting the
# commit that triggered it. On a push or a workflow_dispatch the target is
# `github.sha`. On workflow_run the target is the triggering branch's current
# tip: if that tip is the run's own `head_sha`, this run's CI success already
# proves the tip is green; otherwise the job asks the GitHub API for CI's
# newest run against that tip and only proceeds when it is
# `completed`/`success`. A tip whose CI is still running or failed deploys
# nothing. A still-running tip triggers its own workflow_run once it
# completes, and a failed tip has no green commit to deploy. This is what
# keeps concurrent runs harmless: whichever run actually executes resolves the
# same tip and reconciles the service to it, so an older commit's run never
# ships an older commit over a newer one.
#
# Whether the target needs a deploy is decided against the live service:
# after authenticating to GCP, the job reads the image Cloud Run is currently
# serving with `gcloud run services describe`, takes its commit tag as the
# live commit, and diffs that commit against the target over the paths
# `.github/scripts/deploy_decide.sh` watches. A target identical to the live
# commit, or one whose diff since the live commit touches none of those
# paths, skips the build and the service update entirely. A live tag that
# isn't a commit this checkout knows (a placeholder image, or a since-deleted
# branch) can't be compared, so the job deploys rather than risk skipping a
# real change.
#
# On workflow_dispatch the decide step still reads the live image, so an
# unreadable service fails loudly, but skips the comparison and forces
# deploy=true regardless of the diff. Dispatch exists to force a redeploy of
# exactly the dispatched commit, for example to re-run the migration jobs or
# roll back, and a dispatch of the commit already live, or of one differing
# only outside the watched paths, still has to deploy.
#
# This workflow only swaps the image on Cloud Run services and jobs that
# already exist. `infra` owns creating and configuring them; see
# deploy/README.md for the full division of responsibility.
#
# The apis service moves to an image only after both migration jobs
# (vars.JOB_DATASETS_MIGRATE, vars.JOB_PRESENTATION_MIGRATE), the datasets
# maintenance job (vars.JOB_DATASETS_MAINTENANCE), the origin catalogue job
# (vars.JOB_ORIGIN_CATALOGUE), the search catalogue job
# (vars.JOB_SEARCH_CATALOGUE), the graph release job
# (vars.JOB_GRAPH_RELEASE), and the datasets worker service
# (vars.SERVICE_WORKER) have moved onto that same image: build and push the
# SHA-tagged image, point each job at it, run both migration jobs, make sure a
# compatible origin catalogue is published, then update the worker service,
# then the apis service. Each job is pointed at the new image before it
# executes, so a job still on the `gcr.io/cloudrun/hello` placeholder a fresh
# project starts with never runs as the placeholder. The two migration jobs are idempotent. Given an image
# with nothing new to apply, each reports nothing to apply and exits 0, so
# every deploy runs both rather than trying to detect whether any is needed.
# The datasets maintenance job is pointed at the new image after both
# migrations and left to its Scheduler, and runs `settle` once the apis
# service has moved and `backfill-descriptions` as the last step (see those
# steps). The environment must set vars.JOB_DATASETS_MAINTENANCE; the upfront
# variable check refuses the deploy when it is missing.
# The origin catalogue job is pointed at the new image on every deploy but
# built only when no compatible artifact is published for the image's
# format (see its steps below). The graph release job is pointed at the new
# image and left to its Scheduler; the deploy first checks that the new image
# opens the published release and builds one when it does not (see its step).
# The search catalogue job is pointed at the new image and run once on it,
# waiting for it, then verified to have a build published, before the worker
# and the apis service move (see its steps). A failed step stops the job before any step after it
# runs, so a failed migration or artifact build leaves both services on their
# current image.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment whose variables and secrets name the deploy target
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      # Queries the GitHub API for CI's run against the branch tip, below.
      actions: read
    steps:
      - name: Resolve the commit to deploy
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          # The branch the triggering CI run ran on. The caller's
          # workflow_run filter limits it to one branch.
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tip="$(gh api "repos/${{ github.repository }}/git/ref/heads/$BRANCH" --jq '.object.sha // empty')"
          if [ -z "$tip" ]; then
            echo "::error::gh api returned no sha for repos/${{ github.repository }}/git/ref/heads/$BRANCH."
            exit 1
          fi
          head_sha="${{ github.event.workflow_run.head_sha }}"

          if [ "$tip" = "$head_sha" ]; then
            # This run's own CI success already proves the tip is green.
            echo "sha=$tip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$tip&branch=$BRANCH&event=push&per_page=1" \
            --jq '(.workflow_runs[0] // {}) | "\(.status // "missing") \(.conclusion // "null")"')"
          status="${response%% *}"
          conclusion="${response#* }"

          if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
            echo "sha=$tip" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$BRANCH's tip $tip has CI $status/$conclusion, not completed/success; deploying nothing. A still-running tip triggers its own run on completion, and a failed tip has no green commit to deploy."
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      # `infra` defines the Cloud Run service and job names; the deploy
      # environment carries them as variables. See deploy/README.md. All of
      # them are checked here, before the build and either migration job run,
      # so a missing variable fails fast rather than after burning a full
      # build plus two migrations.
      - name: Resolve image ref
        id: image
        if: steps.target.outputs.sha != ''
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REGION: ${{ vars.REGION }}
          AR_REPO: ${{ vars.AR_REPO }}
          SERVICE_APIS: ${{ vars.SERVICE_APIS }}
          SERVICE_WORKER: ${{ vars.SERVICE_WORKER }}
          JOB_DATASETS_MIGRATE: ${{ vars.JOB_DATASETS_MIGRATE }}
          JOB_PRESENTATION_MIGRATE: ${{ vars.JOB_PRESENTATION_MIGRATE }}
          JOB_ORIGIN_CATALOGUE: ${{ vars.JOB_ORIGIN_CATALOGUE }}
          JOB_SEARCH_CATALOGUE: ${{ vars.JOB_SEARCH_CATALOGUE }}
          JOB_DATASETS_MAINTENANCE: ${{ vars.JOB_DATASETS_MAINTENANCE }}
          JOB_GRAPH_RELEASE: ${{ vars.JOB_GRAPH_RELEASE }}
        run: |
          set -euo pipefail
          missing=0
          checked=0
          for name in PROJECT_ID REGION AR_REPO SERVICE_APIS SERVICE_WORKER \
            JOB_DATASETS_MIGRATE JOB_PRESENTATION_MIGRATE JOB_ORIGIN_CATALOGUE \
            JOB_SEARCH_CATALOGUE JOB_DATASETS_MAINTENANCE JOB_GRAPH_RELEASE; do
            checked=$((checked + 1))
            if [ -z "${!name}" ]; then
              echo "::error::Missing vars.$name in the '${{ inputs.environment }}' GitHub Environment."
              missing=1
            fi
          done
          [ "$checked" -eq 11 ] || { echo "::error::checked $checked variables, expected 11."; exit 1; }
          [ "$missing" -eq 0 ] || exit 1
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/dfo-apis:${{ steps.target.outputs.sha }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.target.outputs.sha != ''
        with:
          ref: ${{ steps.target.outputs.sha }}
          # Full history: the decide step below diffs the live commit against
          # the target, and the live commit can be an arbitrary number of
          # commits back.
          fetch-depth: 0

      - id: auth
        if: steps.target.outputs.sha != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3
        if: steps.target.outputs.sha != ''

      # Reads the commit Cloud Run is currently serving and diffs it against
      # the target over the image's inputs. See the script for the full
      # decision: identical commits, or a diff confined to non-image paths,
      # both skip the build; an unrecognised live tag deploys rather than risk
      # skipping a real change it can't compare.
      - name: Decide whether to deploy
        id: decide
        if: steps.target.outputs.sha != ''
        env:
          SERVICE: ${{ vars.SERVICE_APIS }}
          REGION: ${{ vars.REGION }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          TARGET: ${{ steps.target.outputs.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: .github/scripts/deploy_decide.sh

      - uses: docker/setup-buildx-action@v4
        if: steps.decide.outputs.deploy == 'true'

      - uses: docker/login-action@v4
        if: steps.decide.outputs.deploy == 'true'
        with:
          registry: ${{ vars.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # The image every job below runs is the image this step just pushed.
      # Pointing a job at anything else exits 0 without touching the database.
      #
      # The tag and DFO_BUILD_COMMIT both name the resolved target, so the
      # x-dfo-commit header the service answers with identifies the code
      # actually running.
      - if: steps.decide.outputs.deploy == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: DFO_BUILD_COMMIT=${{ steps.target.outputs.sha }}

      # Both migration Cloud Run Jobs carry lifecycle.ignore_changes on their
      # container image in Terraform, so the deploy pipeline is what moves
      # them onto each new image. `dataset_store.migrate` and
      # `presentation_store.migrate` (the jobs' entrypoints) apply only the
      # migrations not already recorded and exit 0 reporting nothing to do
      # when there are none, so running the job on every deploy is safe
      # whether or not this image carries a new migration.
      - name: Point the datasets migration job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_DATASETS_MIGRATE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      - name: Run the datasets migration job
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.JOB_DATASETS_MIGRATE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait

      - name: Point the presentation migration job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_PRESENTATION_MIGRATE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      - name: Run the presentation migration job
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.JOB_PRESENTATION_MIGRATE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait

      # The datasets maintenance job runs `datasets-maintenance` tasks (the
      # reconciliation sweep, aging terminal operations) on its own Scheduler,
      # so the deploy points it at the new image here and executes it only for
      # the settle step after the services move. It moves after both
      # migrations, so its next run finds the schema this image expects. The
      # job and its variable come from `infra`, and the upfront variable
      # check refuses the deploy when the variable is missing.
      - name: Point the datasets maintenance job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_DATASETS_MAINTENANCE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # The origin catalogue job moves onto the new image on every deploy so
      # its scheduled runs (Cloud Scheduler, every 15 minutes) use the new
      # code. The deploy itself only needs the guarantee the services have at
      # startup: the apis service and the datasets worker load the catalogue
      # through ORIGIN_CATALOGUE_URI
      # (`origin_catalogue.service.get_catalogue_service()`) and fail
      # readiness when none can be loaded. The scheduled job owns freshness,
      # and a running service reloads a newer build within
      # ORIGIN_CATALOGUE_RECHECK_SECONDS, so a deploy does not rebuild a
      # catalogue that is already published.
      - name: Point the origin catalogue job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_ORIGIN_CATALOGUE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # `python -m origin_catalogue.verify` loads the catalogue from
      # ORIGIN_CATALOGUE_URI with the loader the services call at startup and
      # exits non-zero unless a compatible build loads from this image's
      # format root. It runs as an execution of the origin catalogue Job with
      # its args overridden, so it reads the Job's Terraform-provisioned
      # ORIGIN_CATALOGUE_URI.
      #
      # Verify runs first. It passes whenever the new image's format root
      # holds a compatible build, however old, and the deploy goes on. The
      # first deploy and a format bump have no build in the new format root,
      # so verify fails, the build job (`python -m origin_catalogue.job`)
      # runs, and a second verify confirms the build published one, all
      # before traffic moves. With no earlier build to carry forward, that
      # build is a full one, bounded by the Job's 7200-second timeout. The
      # job exits 1 on a refused or failed build, and 0 without publishing
      # when it skips, discards its build or loses the publish race, so the
      # second verify is what checks that a compatible catalogue exists. This
      # path has no earlier build to carry the UN rows forward from, so a UN
      # outage also fails the build (see deploy/origin-catalogue.md). A build
      # failure, or a second verify failure, fails the step and stops the
      # deploy with both services on their current image.
      - name: Ensure a compatible origin catalogue is published
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          verify() {
            gcloud run jobs execute "${{ vars.JOB_ORIGIN_CATALOGUE }}" \
              --region="${{ vars.REGION }}" \
              --project="${{ vars.PROJECT_ID }}" \
              --wait \
              --args=-m,origin_catalogue.verify
          }
          if ! verify; then
            gcloud run jobs execute "${{ vars.JOB_ORIGIN_CATALOGUE }}" \
              --region="${{ vars.REGION }}" \
              --project="${{ vars.PROJECT_ID }}" \
              --wait
            verify
          fi

      # The graph release job moves onto the new image on every deploy so its
      # scheduled ticks (Cloud Scheduler, every 2 minutes) build with the new
      # code. deploy/graph-release.md covers the job.
      - name: Point the graph release job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_GRAPH_RELEASE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # `python -m graph_release.verify` opens the release GRAPH_RELEASE_URI's
      # pointer names for the new image's format through
      # `graph_release.service.ReleaseService`, building the serving views and
      # the origin view, and exits non-zero unless they build. It runs as an
      # execution of the graph release job with its args overridden, so it reads
      # the job's GRAPH_RELEASE_URI.
      #
      # Every serving process fails startup without a release it can open, so
      # the step runs on every deploy. Verify runs first. A format bump
      # has no pointer in the new format, and a release the new view code
      # refuses fails too, so the build job runs once on the new image and a
      # second verify checks what it published. The build runs with
      # `--wait-for-lease`. While a scheduled tick holds the lease, it runs the
      # tick again every 30 seconds for up to 1830 seconds (one lease and one
      # poll). It then builds once the holder is done, or exits `inputs_built`
      # when the holder published these inputs. `--task-timeout=3630s` is that wait
      # plus the 1800-second build the lease allows. A tick exits 0 on a gate
      # finding, an unavailable dependency or a wait that ran out, so the
      # second verify decides. A build failure, or a second verify failure,
      # fails the step and stops the deploy with both services on their
      # current image.
      - name: Ensure a compatible graph release is published
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          verify() {
            gcloud run jobs execute "${{ vars.JOB_GRAPH_RELEASE }}" \
              --region="${{ vars.REGION }}" \
              --project="${{ vars.PROJECT_ID }}" \
              --wait \
              --args=-m,graph_release.verify
          }
          if ! verify; then
            gcloud run jobs execute "${{ vars.JOB_GRAPH_RELEASE }}" \
              --region="${{ vars.REGION }}" \
              --project="${{ vars.PROJECT_ID }}" \
              --wait \
              --task-timeout=3630s \
              --args=-m,graph_release.job,--wait-for-lease
            verify
          fi

      # The search catalogue job (`python -m search.catalogue.job`) builds the
      # example sentences GET /api/search/catalogue serves. It moves onto the
      # new image here, after the origin catalogue and graph release steps,
      # because it reads the catalogue and the release in the new image's
      # formats, which those steps have just ensured are published.
      - name: Point the search catalogue job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_SEARCH_CATALOGUE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # The build key includes the image's commit, and a catalogue format bump
      # starts an empty format root, so the deploy runs the job once on the new
      # image and waits, before traffic moves. The run builds in about 90
      # seconds, or exits at once when the new image's root already carries its
      # key. A run started by a graph release publish may hold the lease; this
      # run waits for it and then builds what the pointers name. A refused or
      # failed build exits non-zero, and some runs exit 0 without publishing (a
      # key refused within six hours, a wait that ran out, a lapsed lease), so
      # the run's exit status decides nothing. A failed run logs a warning, and
      # `python -m search.catalogue.verify`, an execution of the same job with
      # its args overridden, decides. It exits non-zero unless a loadable build
      # is published at the new image's format root, which stops the deploy
      # with both services on their current image. A run that fails at an
      # unchanged format therefore passes on the previous build
      # (deploy/search-catalogue.md).
      - name: Build the search catalogue on the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          if ! gcloud run jobs execute "${{ vars.JOB_SEARCH_CATALOGUE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait; then
            echo "::warning::The search catalogue build failed; verify decides whether a published build serves."
          fi
          gcloud run jobs execute "${{ vars.JOB_SEARCH_CATALOGUE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait \
            --args=-m,search.catalogue.verify

      # The async operations worker (the `infra` repository's google_cloud_run_v2_service
      # .datasets_worker) runs the same image as the apis service, and moves
      # onto the new one before the apis step below does, because an
      # in-flight or newly-enqueued operation must run against the schema and
      # graph release this deploy just brought current. Image-only
      # update, same shape as the apis service step below. `infra` owns the
      # service's own scaling/secrets/runtime-service-account config via
      # lifecycle.ignore_changes on the container image.
      - name: Point the datasets worker at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run services update "${{ vars.SERVICE_WORKER }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # Image-only update against the service `infra` already defined. This
      # step uses `gcloud run services update`, not `gcloud run services
      # replace`, since replace takes a full manifest and would fight
      # `infra` for ownership of scaling, secrets, and the runtime service
      # account. `infra` keeps lifecycle.ignore_changes on the container
      # image in Terraform for the same reason, and replacing the manifest
      # here would fight that too. This step runs only once both migration
      # jobs above have exited 0, so the service never serves an image ahead
      # of the schema it expects.
      - name: Point Cloud Run at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run services update "${{ vars.SERVICE_APIS }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # Until the apis service moved, the previous image could still write a
      # pin reference holding the raw shared secret, the shape migration 0026
      # converted. `datasets-maintenance settle` repeats that migration's
      # statements for a pin principal that is neither a label nor an open
      # caller's `ip:` key, under a table lock that holds pins back until it
      # commits, so a repeat run changes nothing. A version row the previous image writes needs no
      # repair, also for a request an old revision finishes after this step:
      # the insert trigger of migration 0030 fills the facts of a row written
      # with only immutable_body, and that of migration 0033 renames the
      # party-kind enrichment `kind` to `party_kind`. settle counts the version
      # rows holding no facts, those still naming `kind` and the pin references
      # still raw, and fails the step when any count is above 0. It runs as an execution of the maintenance job, whose
      # container command is `datasets-maintenance`, with the task as its
      # args. The step must run on every deploy: a raw pin reference matches
      # no caller's label.
      - name: Settle rows the previous image wrote
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.JOB_DATASETS_MAINTENANCE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait \
            --args=settle

      # A version row holds a description record from the image that writes
      # records onward. `datasets-maintenance backfill-descriptions` writes one,
      # with basis `backfill`, for every version row holding none: those made
      # before records existed, those the previous image wrote until the
      # apis service moved, and those whose stored record fails validation,
      # which it replaces. It runs soon after every deploy, while the series
      # statistics of recent versions are still in the working tier. Each
      # insert is ON CONFLICT DO NOTHING, so a record a mint or publish wrote
      # first stands and a repeat run writes nothing. A version it cannot
      # backfill is logged by id with its traceback and skipped, and is tried
      # again on the next deploy. The step fails when the store is unreachable,
      # or when the task read no version and at least one failed because the
      # store or artifact store was unreachable, timed out or was overloaded,
      # so versions that can never be described never fail a deploy. The
      # task starts no version after 45 minutes, within the Job's
      # 3600-second timeout, and the next deploy carries on from the versions
      # still without a record. It runs last, so no failure of it holds back
      # an earlier step.
      - name: Backfill description records
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.JOB_DATASETS_MAINTENANCE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait \
            --args=backfill-descriptions
