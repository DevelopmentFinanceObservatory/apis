name: Deploy

# The deploy steps every environment runs. deploy-dev.yml and deploy-prod.yml
# call this workflow and choose only the triggers and the GitHub Environment.
# Every project, region, registry, service, and job name comes from that
# environment's variables, so one variable name means the same thing in `dev`
# and `production`. See deploy/README.md for the full list.
#
# The `deploy` job resolves its own target commit rather than trusting the
# commit that triggered it. On a push or a workflow_dispatch the target is
# `github.sha`. On workflow_run the target is the triggering branch's current
# tip: if that tip is the run's own `head_sha`, this run's CI success already
# proves the tip is green; otherwise the job asks the GitHub API for CI's
# newest run against that tip and only proceeds when it is
# `completed`/`success`. A tip whose CI is still running or failed deploys
# nothing. A still-running tip triggers its own workflow_run once it
# completes, and a failed tip has no green commit to deploy. This is what
# keeps concurrent runs harmless: whichever run actually executes resolves the
# same tip and reconciles the service to it, so an older commit's run never
# ships an older commit over a newer one.
#
# Whether the target needs a deploy is decided by
# `.github/scripts/deploy_decide.sh`, which asks whether the revision serving
# the apis service runs the target's code. When the service is in the state a
# finished deploy leaves (traffic follows a ready latest revision, no
# `candidate` tag), the serving commit is the template's image tag, and a
# target equal to it, or one whose diff from it touches none of the watched
# paths, skips every later step. Any other state is unknown, and the target
# deploys: a deploy that stopped part-way is recovered by the next run, which
# starts again from the build. A serving tag that isn't a commit this checkout
# knows (a placeholder image, or a since-deleted branch) can't be compared, so
# the job deploys rather than risk skipping a real change. A manual rollback
# holds only while the calling workflow is disabled (deploy/README.md).
#
# On workflow_dispatch the decide step still reads the service, so an
# unreadable service fails loudly, but deploys regardless of the diff.
# Dispatch exists to force a redeploy of exactly the dispatched commit, for
# example to re-run the migration jobs or roll back, and a dispatch of the
# commit already serving, or of one differing only outside the watched paths,
# still has to deploy.
#
# This workflow only swaps the image on Cloud Run services and jobs that
# already exist. `infra` owns creating and configuring them; see
# deploy/README.md for the full division of responsibility.
#
# The apis service moves to an image only after both migration jobs
# (vars.JOB_DATASETS_MIGRATE, vars.JOB_PRESENTATION_MIGRATE), the datasets
# maintenance job (vars.JOB_DATASETS_MAINTENANCE), the origin catalogue job
# (vars.JOB_ORIGIN_CATALOGUE), the search catalogue job
# (vars.JOB_SEARCH_CATALOGUE), the graph release job
# (vars.JOB_GRAPH_RELEASE), and the datasets worker service
# (vars.SERVICE_WORKER) have moved onto that same image: build and push the
# SHA-tagged image, point each job at it, run both migration jobs, make sure a
# compatible origin catalogue is published, then update the worker service,
# then the apis service. Each job is pointed at the new image before it
# executes, so a job still on the `gcr.io/cloudrun/hello` placeholder a fresh
# project starts with never runs as the placeholder. The two migration jobs are idempotent. Given an image
# with nothing new to apply, each reports nothing to apply and exits 0, so
# every deploy runs both rather than trying to detect whether any is needed.
# The datasets maintenance job is pointed at the new image after both
# migrations and left to its Scheduler, and runs `settle` once the apis
# service has moved, then `rewrite-warnings`, `backfill-warnings` and
# `backfill-descriptions` (see those steps).
# The deploy stages the new revision with no traffic, probes that revision by
# name at its tagged URL, and moves traffic to it by name, so its background
# builds finish before readers arrive and, in production, a revision that
# answers an error or does not answer never serves (see the warm step). The
# environment must set vars.JOB_DATASETS_MAINTENANCE, and the upfront variable
# check refuses the deploy when it is missing.
# The origin catalogue job is pointed at the new image on every deploy but
# built only when no compatible artifact is published for the image's
# format, and goes back to the image the apis service serves when a step
# fails before the worker moves (see its steps below). The graph release job is pointed at the new
# image and left to its Scheduler; the deploy first checks that the new image
# opens the published release and builds one when it does not (see its step).
# The search catalogue job is pointed at the new image and run once on it,
# waiting for it, then verified to have a build published, before the worker
# and the apis service move (see its steps). A failed step stops the job
# before any step after it runs, so a failed migration or artifact build leaves
# both services on their current image. Two recovery steps run after a failure
# or a cancellation. "Point the origin catalogue job back at the serving
# image" runs when one comes after the origin catalogue job moved and before
# the worker moved. "Follow the latest revision after a failure", the last
# step, runs when one comes after traffic moved (see each step).

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment whose variables and secrets name the deploy target
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub's own limit, set here so the ensure step's own timeout below can
    # be read against it.
    timeout-minutes: 360
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      # Queries the GitHub API for CI's run against the branch tip, below.
      actions: read
    steps:
      - name: Resolve the commit to deploy
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          # The branch the triggering CI run ran on. The caller's
          # workflow_run filter limits it to one branch.
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tip="$(gh api "repos/${{ github.repository }}/git/ref/heads/$BRANCH" --jq '.object.sha // empty')"
          if [ -z "$tip" ]; then
            echo "::error::gh api returned no sha for repos/${{ github.repository }}/git/ref/heads/$BRANCH."
            exit 1
          fi
          head_sha="${{ github.event.workflow_run.head_sha }}"

          if [ "$tip" = "$head_sha" ]; then
            # This run's own CI success already proves the tip is green.
            echo "sha=$tip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$tip&branch=$BRANCH&event=push&per_page=1" \
            --jq '(.workflow_runs[0] // {}) | "\(.status // "missing") \(.conclusion // "null")"')"
          status="${response%% *}"
          conclusion="${response#* }"

          if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
            echo "sha=$tip" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$BRANCH's tip $tip has CI $status/$conclusion, not completed/success; deploying nothing. A still-running tip triggers its own run on completion, and a failed tip has no green commit to deploy."
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      # `infra` defines the Cloud Run service and job names; the deploy
      # environment carries them as variables. See deploy/README.md. All of
      # them are checked here, before the build and either migration job run,
      # so a missing variable fails fast rather than after burning a full
      # build plus two migrations.
      - name: Resolve image ref
        id: image
        if: steps.target.outputs.sha != ''
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REGION: ${{ vars.REGION }}
          AR_REPO: ${{ vars.AR_REPO }}
          SERVICE_APIS: ${{ vars.SERVICE_APIS }}
          SERVICE_WORKER: ${{ vars.SERVICE_WORKER }}
          JOB_DATASETS_MIGRATE: ${{ vars.JOB_DATASETS_MIGRATE }}
          JOB_PRESENTATION_MIGRATE: ${{ vars.JOB_PRESENTATION_MIGRATE }}
          JOB_ORIGIN_CATALOGUE: ${{ vars.JOB_ORIGIN_CATALOGUE }}
          JOB_SEARCH_CATALOGUE: ${{ vars.JOB_SEARCH_CATALOGUE }}
          JOB_DATASETS_MAINTENANCE: ${{ vars.JOB_DATASETS_MAINTENANCE }}
          JOB_GRAPH_RELEASE: ${{ vars.JOB_GRAPH_RELEASE }}
        run: |
          set -euo pipefail
          missing=0
          checked=0
          for name in PROJECT_ID REGION AR_REPO SERVICE_APIS SERVICE_WORKER \
            JOB_DATASETS_MIGRATE JOB_PRESENTATION_MIGRATE JOB_ORIGIN_CATALOGUE \
            JOB_SEARCH_CATALOGUE JOB_DATASETS_MAINTENANCE JOB_GRAPH_RELEASE; do
            checked=$((checked + 1))
            if [ -z "${!name}" ]; then
              echo "::error::Missing vars.$name in the '${{ inputs.environment }}' GitHub Environment."
              missing=1
            fi
          done
          [ "$checked" -eq 11 ] || { echo "::error::checked $checked variables, expected 11."; exit 1; }
          [ "$missing" -eq 0 ] || exit 1
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/dfo-apis:${{ steps.target.outputs.sha }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.target.outputs.sha != ''
        with:
          ref: ${{ steps.target.outputs.sha }}
          # Full history: the decide step below diffs the live commit against
          # the target, and the live commit can be an arbitrary number of
          # commits back.
          fetch-depth: 0

      - id: auth
        if: steps.target.outputs.sha != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3
        if: steps.target.outputs.sha != ''

      # Asks whether the revision serving the apis service runs the target's
      # code, and gates every later step on `deploy=true`. See the script for
      # the full decision.
      - name: Decide whether to deploy
        id: decide
        if: steps.target.outputs.sha != ''
        env:
          SERVICE: ${{ vars.SERVICE_APIS }}
          REGION: ${{ vars.REGION }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          TARGET: ${{ steps.target.outputs.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: .github/scripts/deploy_decide.sh

      - uses: docker/setup-buildx-action@v4
        if: steps.decide.outputs.deploy == 'true'

      - uses: docker/login-action@v4
        if: steps.decide.outputs.deploy == 'true'
        with:
          registry: ${{ vars.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # The image every job below runs is the image this step just pushed.
      # Pointing a job at anything else exits 0 without touching the database.
      #
      # The tag and DFO_BUILD_COMMIT both name the resolved target, so the
      # x-dfo-commit header the service answers with identifies the code
      # actually running.
      - id: build
        if: steps.decide.outputs.deploy == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: DFO_BUILD_COMMIT=${{ steps.target.outputs.sha }}

      # A revision records its image by digest, and the build pushes an image
      # index, so the stage step below compares a revision's digest with the
      # index's digest and its linux/amd64 manifest's. This step reads the
      # index now, while the registry login from the auth step is fresh: the
      # access token expires an hour after that step, and the jobs between
      # here and the stage step can run longer.
      - name: Read the pushed image's digests
        id: pushed
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          digests="$(docker buildx imagetools inspect --raw "${{ steps.image.outputs.image }}" |
            python3 -c '
          import json, sys
          digests = [sys.argv[1]]
          for entry in json.load(sys.stdin).get("manifests", []):
              platform = entry.get("platform", {})
              if platform.get("os") == "linux" and platform.get("architecture") == "amd64":
                  digests.append(entry["digest"])
          print(" ".join(digests))
          ' "${{ steps.build.outputs.digest }}")"
          echo "Pushed digests: $digests"
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

      # Both migration Cloud Run Jobs carry lifecycle.ignore_changes on their
      # container image in Terraform, so the deploy pipeline is what moves
      # them onto each new image. `dataset_store.migrate` and
      # `presentation_store.migrate` (the jobs' entrypoints) apply only the
      # migrations not already recorded and exit 0 reporting nothing to do
      # when there are none, so running the job on every deploy is safe
      # whether or not this image carries a new migration.
      - name: Point the datasets migration job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_DATASETS_MIGRATE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      - name: Run the datasets migration job
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.JOB_DATASETS_MIGRATE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait

      - name: Point the presentation migration job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_PRESENTATION_MIGRATE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      - name: Run the presentation migration job
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.JOB_PRESENTATION_MIGRATE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait

      # The datasets maintenance job runs `datasets-maintenance` tasks (the
      # reconciliation sweep, aging terminal operations) on its own Scheduler,
      # so the deploy points it at the new image here and executes it for the
      # settle, warning and description steps after the services move. It
      # moves after both migrations, so its next run finds the schema this
      # image expects. The job and its variable come from `infra`, and the
      # upfront variable check refuses the deploy when the variable is missing.
      - name: Point the datasets maintenance job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_DATASETS_MAINTENANCE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # The origin catalogue job moves onto the new image on every deploy so
      # its scheduled runs (Cloud Scheduler, every 15 minutes) use the new
      # code. The deploy itself only needs the guarantee the services have at
      # startup: the apis service and the datasets worker load the catalogue
      # through ORIGIN_CATALOGUE_URI
      # (`origin_catalogue.service.get_catalogue_service()`) and fail
      # readiness when none can be loaded. The scheduled job owns freshness,
      # and a running service reloads a newer build within
      # ORIGIN_CATALOGUE_RECHECK_SECONDS, so a deploy does not rebuild a
      # catalogue that is already published.
      #
      # Before the update, the step reads the job and outputs `lease`, the
      # build lease object in the new format root (`lease.json` under the
      # job's ORIGIN_CATALOGUE_URI and the checked-out format root), and
      # `task_timeout`, the job's task timeout, which is also the lease's
      # lifetime. The ensure step below reads both
      # (.github/scripts/origin_catalogue_lease.py).
      - name: Point the origin catalogue job at the new image
        id: origin_catalogue_job
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          described="$(gcloud run jobs describe "${{ vars.JOB_ORIGIN_CATALOGUE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --format=json)"
          outputs="$(python3 .github/scripts/origin_catalogue_lease.py <<<"$described")"
          echo "$outputs"
          echo "$outputs" >> "$GITHUB_OUTPUT"
          gcloud run jobs update "${{ vars.JOB_ORIGIN_CATALOGUE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # `python -m origin_catalogue.verify` loads the catalogue from
      # ORIGIN_CATALOGUE_URI with the loader the services call at startup and
      # exits non-zero unless a compatible build loads from this image's
      # format root. It runs as an execution of the origin catalogue Job with
      # its args overridden, so it reads the Job's Terraform-provisioned
      # ORIGIN_CATALOGUE_URI.
      #
      # Verify runs first. It passes whenever the new image's format root
      # holds a compatible build, however old, and the deploy goes on. The
      # first deploy and a format bump have no build in the new format root,
      # so verify fails and the build job (`python -m origin_catalogue.job`)
      # runs, all before traffic moves. With no earlier build to carry
      # forward, that build is a full one, bounded by the Job's 7200-second
      # timeout. This path has no earlier build to carry the UN rows forward
      # from, so a UN outage also fails the build (see
      # deploy/origin-catalogue.md). The job exits 1 on a refused or failed
      # build, which fails the step.
      #
      # The job exits 0 without publishing when it skips (a held ingestion
      # lock, a failed import, a held lease), discards its build or loses the
      # publish race. Only a held lease can still end in a publish: a
      # scheduled run on the new image took `lease.json` and is building. So
      # after an exit 0 the step reads the lease object every 60 seconds with
      # `gcloud storage`, which executes nothing and so raises no
      # failed-execution alert. It waits while the lease names an
      # `expires_at` still ahead, up to the job's task timeout after its own
      # build started: a holder that made the build skip took the lease
      # before then, and Cloud Run kills it within one task timeout. Once the
      # lease is gone, lapsed or past that bound, one verify decides. With no
      # live lease at the first read, as after a skip for a held ingestion
      # lock or a failed import or after a discard, that verify runs at once.
      #
      # The worst case is two verifies plus one task timeout of build and
      # wait, about 140 minutes with the 7200-second timeout, and the step's
      # timeout leaves the rest of the job's 360 minutes to the steps after
      # it. A failed or cancelled step stops the deploy with both services on
      # their current image, and the restore step after the worker update
      # points the job back at the serving image.
      - name: Ensure a compatible origin catalogue is published
        id: origin_catalogue
        if: steps.decide.outputs.deploy == 'true'
        timeout-minutes: 150
        run: |
          set -euo pipefail
          verify() {
            gcloud run jobs execute "${{ vars.JOB_ORIGIN_CATALOGUE }}" \
              --region="${{ vars.REGION }}" \
              --project="${{ vars.PROJECT_ID }}" \
              --wait \
              --args=-m,origin_catalogue.verify
          }
          if verify; then
            exit 0
          fi
          lease="${{ steps.origin_catalogue_job.outputs.lease }}"
          deadline=$(($(date +%s) + ${{ steps.origin_catalogue_job.outputs.task_timeout }}))
          if ! gcloud run jobs execute "${{ vars.JOB_ORIGIN_CATALOGUE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait; then
            echo "::error::The origin catalogue build failed."
            exit 1
          fi
          read_lease() {
            gcloud storage objects list "$lease" --format='value(name)'
          }
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            now=$(date +%s)
            listed="$(read_lease)"
            if [ -z "$listed" ]; then
              echo "Lease read $attempt at $now: no lease at $lease."
              break
            fi
            if ! body="$(gcloud storage cat "$lease")"; then
              listed="$(read_lease)"
              if [ -z "$listed" ]; then
                echo "Lease read $attempt at $now: the lease at $lease went while it was read."
                break
              fi
              echo "::error::gcloud storage could not read $lease."
              exit 1
            fi
            # A lease that does not parse is one the job reclaims, so no run holds it.
            expires=$(python3 -c 'import json, sys; print(int(float(json.loads(sys.argv[1])["expires_at"])))' "$body" 2>/dev/null) || expires=0
            echo "Lease read $attempt at $now: $body"
            if [ "$expires" -le "$now" ]; then
              echo "The lease has lapsed or does not parse, so no run holds it."
              break
            fi
            if [ "$now" -ge "$deadline" ]; then
              echo "The lease is still held at the bound of one task timeout after the build started."
              break
            fi
            echo "A run holds the lease until $expires; reading it again in 60 seconds."
            sleep 60
          done
          if verify; then
            exit 0
          fi
          echo "::error::No compatible origin catalogue loaded after the build exited 0 and no live lease remained."
          exit 1

      # The graph release job moves onto the new image on every deploy so its
      # scheduled ticks (Cloud Scheduler, every 2 minutes) build with the new
      # code. deploy/graph-release.md covers the job.
      - name: Point the graph release job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_GRAPH_RELEASE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # `python -m graph_release.verify` opens the release GRAPH_RELEASE_URI's
      # pointer names for the new image's format through
      # `graph_release.service.ReleaseService`, building the serving views and
      # the origin view, and exits non-zero unless they build. It runs as an
      # execution of the graph release job with its args overridden, so it reads
      # the job's GRAPH_RELEASE_URI.
      #
      # Every serving process fails startup without a release it can open, so
      # the step runs on every deploy. Verify runs first. A format bump
      # has no pointer in the new format, and a release the new view code
      # refuses fails too, so the build job runs once on the new image and a
      # second verify checks what it published. The build runs with
      # `--wait-for-lease`. While a scheduled tick holds the lease, it runs the
      # tick again every 30 seconds for up to 1830 seconds (one lease and one
      # poll). It then builds once the holder is done, or exits `inputs_built`
      # when the holder published these inputs. `--task-timeout=3630s` is that wait
      # plus the 1800-second build the lease allows. A tick exits 0 on a gate
      # finding, an unavailable dependency or a wait that ran out, so the
      # second verify decides. A build failure, or a second verify failure,
      # fails the step and stops the deploy with both services on their
      # current image.
      - name: Ensure a compatible graph release is published
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          verify() {
            gcloud run jobs execute "${{ vars.JOB_GRAPH_RELEASE }}" \
              --region="${{ vars.REGION }}" \
              --project="${{ vars.PROJECT_ID }}" \
              --wait \
              --args=-m,graph_release.verify
          }
          if ! verify; then
            gcloud run jobs execute "${{ vars.JOB_GRAPH_RELEASE }}" \
              --region="${{ vars.REGION }}" \
              --project="${{ vars.PROJECT_ID }}" \
              --wait \
              --task-timeout=3630s \
              --args=-m,graph_release.job,--wait-for-lease
            verify
          fi

      # The search catalogue job (`python -m search.catalogue.job`) builds the
      # example sentences GET /api/search/catalogue serves. It moves onto the
      # new image here, after the origin catalogue and graph release steps,
      # because it reads the catalogue and the release in the new image's
      # formats, which those steps have just ensured are published.
      - name: Point the search catalogue job at the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs update "${{ vars.JOB_SEARCH_CATALOGUE }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # The build key includes the image's commit, and a catalogue format bump
      # starts an empty format root, so the deploy runs the job once on the new
      # image and waits, before traffic moves. The run builds in about 90
      # seconds, or exits at once when the new image's root already carries its
      # key. A run started by a graph release publish may hold the lease; this
      # run waits for it and then builds what the pointers name. A refused or
      # failed build exits non-zero, and some runs exit 0 without publishing (a
      # key refused within six hours, a wait that ran out, a lapsed lease), so
      # the run's exit status decides nothing. A failed run logs a warning, and
      # `python -m search.catalogue.verify`, an execution of the same job with
      # its args overridden, decides. It exits non-zero unless a loadable build
      # is published at the new image's format root, which stops the deploy
      # with both services on their current image. A run that fails at an
      # unchanged format therefore passes on the previous build
      # (deploy/search-catalogue.md).
      - name: Build the search catalogue on the new image
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          if ! gcloud run jobs execute "${{ vars.JOB_SEARCH_CATALOGUE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait; then
            echo "::warning::The search catalogue build failed; verify decides whether a published build serves."
          fi
          gcloud run jobs execute "${{ vars.JOB_SEARCH_CATALOGUE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait \
            --args=-m,search.catalogue.verify

      # The async operations worker (the `infra` repository's google_cloud_run_v2_service
      # .datasets_worker) runs the same image as the apis service, and moves
      # onto the new one before the apis step below does, because an
      # in-flight or newly-enqueued operation must run against the schema and
      # graph release this deploy just brought current. Image-only
      # update, with traffic following the new revision at once. `infra` owns the
      # service's own scaling/secrets/runtime-service-account config via
      # lifecycle.ignore_changes on the container image.
      - name: Point the datasets worker at the new image
        id: worker
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run services update "${{ vars.SERVICE_WORKER }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # A job on the new image writes only the new format root. The worker
      # update above is the first step that puts a reader on that root, since
      # the worker loads the catalogue through ORIGIN_CATALOGUE_URI and takes
      # traffic at once. When any step from the origin catalogue job's update
      # up to the worker's fails or is cancelled, this step points the job at
      # the image the apis service serves (the decide step's
      # `serving_image`), so its scheduled runs keep the root the services
      # read fresh. A worker update that fails part-way leaves the worker on
      # its old revision, so it counts as a failure before the boundary. An
      # image outside the project's Artifact Registry repository, such as the
      # `gcr.io/cloudrun/hello` placeholder a fresh project starts with,
      # stays unused: the step leaves the job and fails. An execution already
      # running keeps the new image.
      - name: Point the origin catalogue job back at the serving image
        if: always() && steps.origin_catalogue_job.outcome == 'success' && steps.worker.outcome != 'success' && (failure() || cancelled())
        run: |
          set -euo pipefail
          serving="${{ steps.decide.outputs.serving_image }}"
          case "$serving" in
            "${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.AR_REPO }}/"?*) ;;
            *)
              echo "::error::The apis service serves '$serving', which is not in the project's Artifact Registry repository, so ${{ vars.JOB_ORIGIN_CATALOGUE }} stays on the new image. Point it at a serving image by hand."
              exit 1
              ;;
          esac
          if [ "$serving" = "${{ steps.image.outputs.image }}" ]; then
            echo "The apis service serves the new image; ${{ vars.JOB_ORIGIN_CATALOGUE }} stays on it."
            exit 0
          fi
          gcloud run jobs update "${{ vars.JOB_ORIGIN_CATALOGUE }}" \
            --image="$serving" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet
          echo "::error::The deploy stopped before the worker moved; ${{ vars.JOB_ORIGIN_CATALOGUE }} is back on $serving."

      # Image-only update against the service `infra` already defined. This
      # step uses `gcloud run services update`, not `gcloud run services
      # replace`, since replace takes a full manifest and would fight
      # `infra` for ownership of scaling, secrets, and the runtime service
      # account. `infra` keeps lifecycle.ignore_changes on the container
      # image in Terraform for the same reason, and replacing the manifest
      # here would fight that too. This step runs only once both migration
      # jobs above have exited 0, so the service never serves an image ahead
      # of the schema it expects. `--no-traffic` creates the revision with no
      # traffic and pins the traffic to the revision serving now, by name. The
      # step then reads the revision the update created, the latest created
      # one, and fails unless it runs one of the digests the build pushed: an
      # `infra` apply that lands during the update can create a revision from
      # the image its plan refreshed. It then tags the revision
      # `candidate` with `update-traffic`, which gives it a URL of its own and
      # moves the tag off any older revision. `--tag` on the
      # update would make gcloud name the template revision, which the infra
      # repository's Terraform does not ignore, so every later apply would
      # clear the name and create a revision. The cost is a second call. The
      # step outputs the revision's name, and every later step acts on it.
      - name: Stage the new revision with no traffic
        id: stage
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run services update "${{ vars.SERVICE_APIS }}" \
            --image="${{ steps.image.outputs.image }}" \
            --no-traffic \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet
          revision="$(gcloud run services describe "${{ vars.SERVICE_APIS }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --format='value(status.latestCreatedRevisionName)')"
          if [ -z "$revision" ]; then
            echo "::error::The apis service reported no latest created revision after the update."
            exit 1
          fi
          image="$(gcloud run revisions describe "$revision" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --format='value(spec.containers[0].image)')"
          case " ${{ steps.pushed.outputs.digests }} " in
            *" ${image##*@} "*) ;;
            *)
              echo "::error::Revision $revision runs ${image##*/}, not one of the digests the build pushed (${{ steps.pushed.outputs.digests }}), so it is not probed."
              exit 1
              ;;
          esac
          gcloud run services update-traffic "${{ vars.SERVICE_APIS }}" \
            --update-tags="candidate=$revision" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet
          echo "Staged revision $revision, running ${image##*/}, with no traffic and the candidate tag."
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # The candidate revision builds the skills index, the Graph schema
      # document and the UN terms body beside serving, and Cloud Run throttles
      # the CPU of an instance with no request in flight, so a revision nobody
      # calls stalls those builds until its first readers pay for them. This
      # step calls the candidate's tagged URL before traffic moves, as the
      # deployer with an ID token for the service URL: the routes whose
      # handlers wait on those builds, and `POST /api/search/stated-scope`.
      # Each route retries a 502, 503, 504 or 429, or no answer, for up to 300
      # seconds. A route that never answers at all within its deadline is an
      # error everywhere and ends the probe, since a revision that answers no
      # request within its deadline has hung. On dev, a route still slow at
      # its deadline, an answer of 401 or 403, or an unreadable URL or token
      # warns and the deploy goes on. In production (REQUIRE_PROBE) each of
      # those is an error, so every route must answer 200. Any other status is
      # an error everywhere, except a 404 `origin_not_served` from the UN
      # terms route, which a deployment with the UN origin off answers and
      # which skips that route. A candidate without its tagged URL is an
      # error, since no other URL reaches it. See
      # .github/scripts/deploy_warm.sh.
      - name: Warm the candidate revision
        id: warm
        if: steps.decide.outputs.deploy == 'true'
        env:
          SERVICE: ${{ vars.SERVICE_APIS }}
          REGION: ${{ vars.REGION }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          DEPLOYER: ${{ secrets.WIF_SA }}
          REVISION: ${{ steps.stage.outputs.revision }}
          PROBE_TAG: candidate
          REQUIRE_PROBE: ${{ inputs.environment == 'production' }}
        run: .github/scripts/deploy_warm.sh

      # Traffic moves on `warm`, and on dev also on `slow`, `forbidden` or
      # `unavailable`. Any other status, an empty one included, fails the run
      # with the previous revision still serving.
      - name: Fail on errors the candidate revision answered while warming
        if: steps.decide.outputs.deploy == 'true'
        env:
          WARM_STATUS: ${{ steps.warm.outputs.status }}
          REQUIRE_PROBE: ${{ inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          echo "warm status: $WARM_STATUS"
          case "$WARM_STATUS" in
            warm) exit 0 ;;
            slow | forbidden | unavailable)
              if [ "$REQUIRE_PROBE" != true ]; then
                exit 0
              fi
              ;;
          esac
          echo "::error::The candidate revision answered a probe with an error, or could not be probed where the probe is required. Traffic stays on the previous revision. See the 'Warm the candidate revision' step."
          exit 1

      # Moves all traffic to the probed revision by name, so no other
      # revision can take it while settle and backfill run.
      - name: Move traffic to the candidate revision
        id: move
        if: steps.decide.outputs.deploy == 'true'
        env:
          REVISION: ${{ steps.stage.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ vars.SERVICE_APIS }}" \
            --to-revisions="$REVISION=100" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # Until the apis service moved, the previous image could still write a
      # pin reference holding the raw shared secret, the shape migration 0026
      # converted. `datasets-maintenance settle` repeats that migration's
      # statements for a pin principal that is neither a label nor an open
      # caller's `ip:`, `user:` or `conversation:` key, under a table lock
      # that holds pins back until it commits, so a repeat run changes
      # nothing. A version row the previous image writes needs no repair, also
      # for a request an old revision finishes after this step: the insert
      # trigger of migration 0030 fills the facts of a row written with only
      # immutable_body, and that of migration 0033 renames the party-kind
      # enrichment `kind` to `party_kind`. settle counts the version rows
      # holding no facts, those still naming `kind` and the pin references
      # still raw, and fails the step when any count is above 0. It runs as an
      # execution of the maintenance job, whose container command is
      # `datasets-maintenance`, with the task as its args. The step must run
      # on every deploy: a raw pin reference matches no caller's label.
      - name: Settle rows the previous image wrote
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.JOB_DATASETS_MAINTENANCE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait \
            --args=settle

      # An image older than the current warning writers stores warnings that
      # name refs in an old shape, until the services move and from requests
      # it still holds afterwards. `datasets-maintenance rewrite-warnings`
      # rewrites them, in the `warnings` column and in `immutable_body`, each
      # from its own value (`dataset_store.warning_formats`). It scans
      # `version_record` on every run, 500 rows by key to a transaction, so a
      # failed run keeps the pages it committed, and the next run, which scans
      # from the start, finds only the rows still in an old shape. A warning it
      # cannot parse stays as stored. It logs the rows it rewrote; the next
      # step's summary counts the rows still in an old shape. A failure here
      # lets the steps after it run, and the last step fails the run.
      - name: Rewrite warnings in an old format
        id: rewrite_warnings
        if: steps.decide.outputs.deploy == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.JOB_DATASETS_MAINTENANCE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait \
            --args=rewrite-warnings

      # rewrite-warnings leaves the old `coverage_below_scope` member sentence
      # as stored, since splitting its members into off-cadence and
      # out-of-window ones needs graph reads. `datasets-maintenance
      # backfill-warnings` rewrites it, in the `warnings` column and in
      # `immutable_body`, each from its own value, one row per transaction; the
      # selection matches only rows still holding the sentence, so a repeat run
      # touches only the rows that remain. It reads the graph, SDMX and UN base
      # URLs and the origin catalogue from the maintenance job's environment.
      # It starts no row after 45 minutes, within the Job's 3600-second
      # timeout. The step fails when a row failed for a cause a retry can
      # clear, lost to a concurrent write or was left by the budget, and the
      # next deploy carries on from the rows that remain. A row that fails with
      # a defect is selected again, so it fails the step on every run until the
      # code is fixed. A row it refuses for good is logged as one WARNING line
      # on every run and sets no exit code, and its summary counts the rows
      # still holding any old shape (`legacy_warning_refs`), which sets no exit
      # code; a count that fails or runs past 25 s (five sixths of the store's
      # 30-second socket bound) is logged at ERROR with a null count and sets
      # no exit code either. A failure here lets the steps after it run, and
      # the last step fails the run.
      - name: Backfill warning counts
        id: backfill_warnings
        if: steps.decide.outputs.deploy == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.JOB_DATASETS_MAINTENANCE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait \
            --args=backfill-warnings

      # A version row holds a description record from the image that writes
      # records onward. `datasets-maintenance backfill-descriptions` writes one,
      # with basis `backfill`, for every version row holding none: those made
      # before records existed, those the previous image wrote until the
      # apis service moved, and those whose stored record fails validation,
      # which it replaces. It runs soon after every deploy, while the series
      # statistics of recent versions are still in the working tier. Each
      # insert is ON CONFLICT DO NOTHING, so a record a mint or publish wrote
      # first stands and a repeat run writes nothing. A version it cannot
      # backfill is logged by id with its traceback and skipped, and is tried
      # again on the next deploy. The step fails when the store is
      # unreachable, or when the task read no version and at least one failed
      # because the store or artifact store was unreachable, timed out or was
      # overloaded, so versions that can never be described never fail a
      # deploy. The task starts no version after 45 minutes, within the Job's
      # 3600-second timeout, and the next deploy carries on from the versions
      # still without a record.
      - name: Backfill description records
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.JOB_DATASETS_MAINTENANCE }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --wait \
            --args=backfill-descriptions

      # Traffic follows the latest revision again, so a revision `infra`
      # creates for a configuration change serves at once, as before this
      # deploy, and the `candidate` tag goes in the same update. A tag left by
      # a failed run makes the next run deploy (see the decide step).
      - name: Follow the latest revision again
        id: follow
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ vars.SERVICE_APIS }}" \
            --to-latest \
            --remove-tags=candidate \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet

      # An `infra` apply that updates the apis service sends the traffic and the
      # image its plan refreshed, so one that overlaps this deploy can put the
      # previous traffic or the previous image back. This step fails the run
      # unless traffic follows the latest revision at 100 percent and that
      # revision runs the released image, which a revision `infra` creates for
      # a configuration change after the move also does. A failure leaves
      # traffic as the step found it, pinned or on another image, and the next
      # run deploys.
      - name: Check the released image serves
        if: steps.decide.outputs.deploy == 'true'
        env:
          IMAGE: ${{ steps.stage.outputs.image }}
        run: |
          set -euo pipefail
          serving="$(gcloud run services describe "${{ vars.SERVICE_APIS }}" \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --format=json |
            python3 -c '
          import json, sys
          traffic = json.load(sys.stdin).get("status", {}).get("traffic", [])
          whole = [e for e in traffic if e.get("percent") == 100 and e.get("latestRevision")]
          print(whole[0].get("revisionName", "") if whole else "")
          ')"
          image=""
          if [ -n "$serving" ]; then
            image="$(gcloud run revisions describe "$serving" \
              --region="${{ vars.REGION }}" \
              --project="${{ vars.PROJECT_ID }}" \
              --format='value(spec.containers[0].image)')"
          fi
          if [ "$image" != "$IMAGE" ]; then
            echo "::error::Traffic on the apis service does not follow the latest revision at 100 percent running the released image $IMAGE (serving: ${serving:-none following the latest revision}, image: ${image:-unread}). The next run deploys again."
            exit 1
          fi
          echo "Revision $serving serves all traffic as the latest revision and runs the released image."

      # The two warning steps continue on error, so a failure in either still
      # runs the description backfill, whose records depend on series
      # statistics that leave the working tier, makes traffic follow the
      # latest revision and checks the released image. This step then fails
      # the run and names each warning step that failed. Traffic already
      # follows the latest revision without the `candidate` tag, so a rerun of
      # the same commit deploys nothing; the next deploy, or a
      # `workflow_dispatch` run, runs the warning steps again from the rows
      # that remain.
      - name: Fail on a failed warning step
        if: steps.decide.outputs.deploy == 'true'
        env:
          REWRITE_WARNINGS: ${{ steps.rewrite_warnings.outcome }}
          BACKFILL_WARNINGS: ${{ steps.backfill_warnings.outcome }}
        run: |
          set -euo pipefail
          failed=0
          if [ "$REWRITE_WARNINGS" = failure ]; then
            echo "::error::The 'Rewrite warnings in an old format' step failed. Its log names the maintenance job execution and why it failed."
            failed=1
          fi
          if [ "$BACKFILL_WARNINGS" = failure ]; then
            echo "::error::The 'Backfill warning counts' step failed. Its log names the maintenance job execution and why it failed."
            failed=1
          fi
          exit "$failed"

      # A failure or a cancellation after the move, in settle, the description
      # backfill or the follow step, would leave traffic pinned by name, so a
      # revision `infra` creates for a configuration change would serve
      # nothing until a deploy succeeds. This step makes traffic follow the latest revision again and
      # keeps the `candidate` tag, so the next run still deploys. A failed
      # warning step fails the run only in the step above, after the follow
      # step succeeded, so it does not run this step.
      - name: Follow the latest revision after a failure
        if: (failure() || cancelled()) && steps.move.outcome == 'success' && steps.follow.outcome != 'success'
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ vars.SERVICE_APIS }}" \
            --to-latest \
            --region="${{ vars.REGION }}" \
            --project="${{ vars.PROJECT_ID }}" \
            --quiet
