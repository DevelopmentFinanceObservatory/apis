# Two live checks against the dev Data Commons Cloud Run service, neither of
# which ci.yml ever runs since it talks only to recorded fixtures:
#
# - test_export_canary.py re-reads a fixed, roughly-60-row stratified sample
#   of the committed packages/dfo-data-tools/src/code_index/data/index.json.gz
#   through the export's own two-pass forward read, comparing each sampled
#   row against the committed one. Cheap (single-digit seconds against the
#   graph), so it runs every six hours, every day of the week.
# - test_export_drift.py re-exports from the graph every block of the code
#   index the graph determines and compares it against the committed export
#   (each row's provenances come from the coverage build, which
#   deploy-dev.yml checks). Exhaustive, so it runs far less often: the
#   weekday schedule, every pull request touching the paths below once it
#   is out of draft, and manual dispatch, so a graph-content regression is
#   caught at review time too. A push runs nothing, since the weekday
#   schedule already catches drift on dev. See export_code_index.py's own
#   docstring for what each check reads.
#
# Credentials are the pair eval-gate.yml and sdmx-live.yml already use: the
# repo variable SEARCH_GRAPH_BASE (the service root) and the repo secret
# SEARCH_GRAPH_TOKEN (the x-graph-token WAF bypass -- runner IPs are
# datacenter ranges the service challenges).
#
# The full-export job runs only for same-repo branches -- a fork PR receives
# no secrets and would fail on an empty token with nothing the author could
# do about it. The canary job never sees a pull_request event at all.
#
# Do NOT add this workflow to branch protection's required checks: it is
# path-filtered and skipped on fork PRs, and a required check reports nothing
# in either case, hanging as "Expected" forever.
name: Code index live

on:
  pull_request:
    branches: [dev, main]
    # `edited` covers a stacked PR whose base is retargeted automatically when
    # the PR beneath it merges, which emits no other activity type. See the
    # matching note in ci.yml. `ready_for_review` covers a draft PR marked
    # ready without a new commit, which otherwise leaves this check with no
    # run at all.
    # code-index-drift skips while the PR is a draft, and `ready_for_review`
    # starts the run then.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - packages/dfo-data-tools/src/code_index/**
      - tests/code_index/**
      - scripts/export_code_index.py
      - .github/workflows/code-index-live.yml
      - pyproject.toml
      - uv.lock
  schedule:
    # Canary: every six hours, every day. `github.event.schedule` carries the
    # exact cron string that fired, which is how the two jobs below tell
    # their schedule triggers apart.
    - cron: "23 */6 * * *"
    # Exact full export: 06:23 UTC, weekdays. GitHub cron is always UTC and
    # never shifts for DST, and a scheduled run can be delayed or dropped
    # under load, so this bounds how stale an undetected graph-content drift
    # gets rather than guaranteeing a daily run.
    - cron: "23 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the PR number for pull_request events: a run on a closed PR
  # resolves `github.ref` to the base branch, which would otherwise share a
  # group with that branch's scheduled and dispatched runs and cancel them
  # mid-suite.
  group: code-index-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # See ci.yml: `uv run` runs in exactly what the job's `uv sync` installed.
  UV_NO_SYNC: "1"

jobs:
  code-index-canary:
    # Only the six-hourly cron -- pull_request, workflow_dispatch, and the
    # weekday cron all go to code-index-drift below. Runs against dev's
    # live graph, so only in ONEcampaign.
    if: github.repository_owner == 'ONEcampaign' && github.event_name == 'schedule' && github.event.schedule == '23 */6 * * *'
    runs-on: ubuntu-latest
    # Measured at ~6s against the dev deployment (a ~60-row sample plus
    # pytest startup); this leaves headroom for checkout, uv sync, and a
    # slower graph response without chasing a tight bound.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # code_index arrives through the dfo-data-tools workspace member, whose
      # dfo-spec-kit-frame-grammar dependency lives in the private
      # dfo-spec-kit repo, so this job authenticates the same way the other
      # workflows do. scripts/export_code_index.py imports materialise.graph,
      # which needs the `sdmx` extra (httpx). tests/conftest.py installs the
      # session coverage service, which needs the `coverage` extra (numpy).
      - name: Authenticate git for the dfo-spec-kit dependency
        uses: ./.github/actions/spec-kit-auth
        with:
          client-id: ${{ vars.READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --group test --extra sdmx --extra coverage

      - name: Check the graph credentials reached the runner
        env:
          GRAPH_BASE: ${{ vars.SEARCH_GRAPH_BASE }}
          GRAPH_TOKEN: ${{ secrets.SEARCH_GRAPH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GRAPH_BASE" ] || { echo "::error::repo variable SEARCH_GRAPH_BASE is unset"; exit 1; }
          [ -n "$GRAPH_TOKEN" ] || { echo "::error::repo secret SEARCH_GRAPH_TOKEN is unset"; exit 1; }

      - name: Run the code index sampling canary against the dev deployment
        env:
          SEARCH_GRAPH_BASE: ${{ vars.SEARCH_GRAPH_BASE }}
          SEARCH_GRAPH_TOKEN: ${{ secrets.SEARCH_GRAPH_TOKEN }}
        run: uv run pytest -q -m live tests/code_index/test_export_canary.py

  code-index-drift:
    # Runs against dev's live graph, so only in ONEcampaign.
    if: >-
      github.repository_owner == 'ONEcampaign' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.draft != true &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'schedule' && github.event.schedule == '23 6 * * 1-5'))
    runs-on: ubuntu-latest
    # The exporter's own concurrency fix cut this from 14m31s (sequential
    # /v2/node POSTs) to ~3m10s wall clock against the dev deployment,
    # measured locally with `uv run --env-file .env python
    # scripts/export_code_index.py`. 12 minutes leaves roughly 4x headroom
    # over that for checkout, uv sync, and CI-runner-to-Cloud-Run latency
    # that a workstation run doesn't see.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # code_index arrives through the dfo-data-tools workspace member, whose
      # dfo-spec-kit-frame-grammar dependency lives in the private
      # dfo-spec-kit repo, so this job authenticates the same way the other
      # workflows do. scripts/export_code_index.py imports materialise.graph,
      # which needs the `sdmx` extra (httpx). tests/conftest.py installs the
      # session coverage service, which needs the `coverage` extra (numpy).
      - name: Authenticate git for the dfo-spec-kit dependency
        uses: ./.github/actions/spec-kit-auth
        with:
          client-id: ${{ vars.READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --group test --extra sdmx --extra coverage

      - name: Check the graph credentials reached the runner
        env:
          GRAPH_BASE: ${{ vars.SEARCH_GRAPH_BASE }}
          GRAPH_TOKEN: ${{ secrets.SEARCH_GRAPH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GRAPH_BASE" ] || { echo "::error::repo variable SEARCH_GRAPH_BASE is unset"; exit 1; }
          [ -n "$GRAPH_TOKEN" ] || { echo "::error::repo secret SEARCH_GRAPH_TOKEN is unset"; exit 1; }

      - name: Run the code index drift test against the dev deployment
        env:
          SEARCH_GRAPH_BASE: ${{ vars.SEARCH_GRAPH_BASE }}
          SEARCH_GRAPH_TOKEN: ${{ secrets.SEARCH_GRAPH_TOKEN }}
        run: uv run pytest -q -m live tests/code_index/test_export_drift.py
