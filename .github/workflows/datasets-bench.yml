# Runs scripts/bench_datasets.py against a deployed Datasets API and uploads its
# JSON report: p50 and p95 latency and the store, upstream, signing and permit
# counts each response's Server-Timing header carries, for cold and warm mints,
# cold and warm definition GETs, a snapshot read, 20 concurrent warm GETs and 3
# then 6 concurrent cold mints, over the q1 and q3 shapes the script names.
#
# Dispatch only: every run mints new versions on the target and holds its
# materialise permits, so it never runs on a schedule or a push. The default
# target is the dfo-dev Cloud Run service `infra` defines. The script sends a
# Cloud Run ID token minted for the target as the eval reader account
# (search.eval.apis_auth), which holds roles/run.invoker on the dev service
# only, so another target refuses the run with 401 or 403.
name: Datasets bench

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the deployed API to bench
        required: true
        default: https://dfo-dev-apis-zms5lj4zhq-nn.a.run.app
      samples:
        description: Samples per sequential request kind
        required: true
        default: "5"
      seed:
        description: Seed for the cold requests' window variants (empty picks one)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Two benches against one target would contend for its permits and skew both.
  group: datasets-bench-${{ inputs.base_url }}
  cancel-in-progress: false

env:
  UV_NO_SYNC: "1"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --extra datasets

      - name: Authenticate to Google Cloud as the eval reader
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.EVAL_WIF_PROVIDER }}
          service_account: ${{ secrets.EVAL_WIF_SA }}

      - name: Run the bench
        env:
          BASE_URL: ${{ inputs.base_url }}
          SAMPLES: ${{ inputs.samples }}
          SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          args=(--base-url "$BASE_URL" --samples "$SAMPLES" --out bench-datasets.json)
          if [ -n "$SEED" ]; then
            args+=(--seed "$SEED")
          fi
          uv run python scripts/bench_datasets.py "${args[@]}"

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: datasets-bench-${{ github.run_id }}
          path: bench-datasets.json
          if-no-files-found: error
