name: Eval nightly

# One sample of every eligible corpus case against the deployed dev service
# (python -m search.eval.sync --nightly, which syncs the Langfuse datasets
# first). The run is written as a dfo-evals run record and pushed to Langfuse
# as one experiment per case file. The run summary lists every check that
# failed outside its case's known_failure and every check lost to
# infrastructure, and says whether the Langfuse push completed; a push that
# did not also raises its own warning.
#
# Once the run ends, whatever its exit code, the record is copied to the
# eval runs bucket under apis-search/<run id>/, results.jsonl first and
# manifest.json second, since a reader treats a run with a manifest as
# complete. The copy authenticates as the eval runs writer, which may create
# objects only under apis-search/ and whose workload identity binding admits
# only this workflow file on dev. Each object is created only when none of
# its name exists (search.eval.record_upload).
#
# The nightly and the corpus sync (eval-sync.yml) share one concurrency
# group, since both write the Langfuse datasets and a sync during the
# nightly would change the item inputs its push checks.
#
# The job fails on exit 2, a crash or setup error, whether or not alerting is on.
# Alerting is off unless the repository variable EVAL_NIGHTLY_ALERT is 'true'.
# With it off, an unmarked failure (1) or an infrastructure loss (3) is a
# warning and the job passes. With it on, either fails the job, and an unmarked
# failure opens one issue, or updates its body when it is already open.
#
# Every request to the service carries a Cloud Run ID token the eval reader
# account mints and refreshes for the run (search.eval.apis_auth). A 401 or 403
# from the service is a crash (2), which fails the job. An eval the service
# refuses measures nothing.

on:
  schedule:
    # 04:17 UTC daily. GitHub cron is always UTC.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-langfuse
  cancel-in-progress: false
  # Keeps every pending run in order. By default a group holds one pending run,
  # and a newer one cancels it, so a corpus sync could drop a waiting nightly.
  queue: max

env:
  UV_SYNC_ARGS: --frozen --extra eval --extra api --extra engine --extra datasets --extra graph
  UV_NO_SYNC: "1"
  # The dfo-dev Cloud Run service `infra` defines.
  SEARCH_API_URL: https://dfo-dev-apis-zms5lj4zhq-nn.a.run.app
  ISSUE_TITLE: "Nightly Search eval: unmarked failures"

jobs:
  nightly:
    name: Eval nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync ${{ env.UV_SYNC_ARGS }} --no-default-groups

      # The checks read the deployed graph release and origin catalogue
      # buckets, and the eval calls the dev service with ID tokens it mints as
      # this account. The checks also read the graph service, which admits only
      # callers holding roles/run.invoker. For each *.run.app host,
      # dfo_platform.cloud_run_auth mints an ID token from this step's workload
      # identity credentials as the eval reader, which holds
      # roles/iam.serviceAccountOpenIdTokenCreator on itself, and refreshes it
      # before it expires.
      - name: Authenticate to Google Cloud as the eval reader
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.EVAL_WIF_PROVIDER }}
          service_account: ${{ secrets.EVAL_WIF_SA }}

      - name: Run the nightly eval
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          # The project the Langfuse keys must name; the push refuses any other.
          LANGFUSE_PROJECT_ID: ${{ vars.LANGFUSE_PROJECT_ID }}
          SEARCH_GRAPH_BASE: ${{ vars.SEARCH_GRAPH_BASE }}
          # WAF bypass for the graph: CI runner IPs are datacenter ranges the
          # graph's bot protection challenges, and this header exempts them.
          SEARCH_GRAPH_TOKEN: ${{ secrets.SEARCH_GRAPH_TOKEN }}
          GRAPH_RELEASE_URI: ${{ vars.GRAPH_RELEASE_URI }}
          ORIGIN_CATALOGUE_URI: gs://dfo-dev-origin-catalogue-dev-fin-observatory/
          ALERT: ${{ vars.EVAL_NIGHTLY_ALERT }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/nightly.md"
          rc=0
          uv run python -m search.eval.sync --nightly "$SEARCH_API_URL" --summary "$summary" \
            --records "$RUNNER_TEMP/eval-records" || rc=$?
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$rc" in
            0) exit 0 ;;
            1|3) ;;
            *) echo "::error::The nightly eval crashed with exit code $rc."; exit "$rc" ;;
          esac
          if [ "$ALERT" != "true" ]; then
            echo "::warning::The nightly eval exited $rc; alerting is off (vars.EVAL_NIGHTLY_ALERT)."
            exit 0
          fi
          if [ "$rc" -eq 1 ]; then
            body="$RUNNER_TEMP/issue.md"
            { [ -f "$summary" ] && cat "$summary" && echo; echo "Run: $RUN_URL"; } > "$body"
            number="$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
              --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")"
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$body"
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$body"
            fi
          fi
          echo "::error::The nightly eval exited $rc; see the run summary."
          exit 1

      # The writer may create objects only under apis-search/ in the eval runs
      # bucket, and its workload identity binding admits only this workflow
      # file on dev. The bucket is the private destination for raw records.
      - name: Skip the upload off dev
        if: ${{ !cancelled() && github.ref != 'refs/heads/dev' }}
        run: echo "::notice::Run from $GITHUB_REF. Only runs on dev persist their records."

      - name: Authenticate to Google Cloud as the eval runs writer
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.EVAL_WIF_PROVIDER }}
          service_account: ${{ secrets.EVAL_RUNS_WRITER_SA }}

      # results.jsonl goes first and manifest.json second: a reader treats a
      # run with a manifest as complete. search.eval.record_upload creates each
      # object only when none of its name exists, which needs no read: the
      # writer may create objects and nothing else, and gcloud storage cp reads
      # the destination first.
      - name: Upload the run record
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        env:
          BUCKET: ${{ vars.EVAL_RUNS_BUCKET }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/eval-records"
          if [ ! -d "$root/apis-search" ]; then
            echo "::notice::The nightly wrote no run record; nothing to upload."
            exit 0
          fi
          : "${BUCKET:?vars.EVAL_RUNS_BUCKET is unset}"
          uv run python -m search.eval.record_upload --bucket "$BUCKET" "$root"
          shopt -s nullglob
          for manifest in "$root"/apis-search/*/manifest.json; do
            run_id="$(basename "$(dirname "$manifest")")"
            echo "Uploaded the run record to gs://$BUCKET/apis-search/$run_id/" >> "$GITHUB_STEP_SUMMARY"
          done
