name: Deploy production

# Reconciles the production apis service, its datasets worker, and its jobs
# to the pushed or dispatched commit on main. The steps live in deploy.yml,
# which deploy-dev.yml shares; this file chooses the triggers and the
# `production` GitHub Environment.
#
# A push deploys the pushed commit when its image inputs differ from what the
# service is serving. A dispatch always deploys the dispatched commit, for
# example to re-run the migration jobs or roll back. When traffic was moved by
# hand off a revision with the target's image inputs, the deploy refuses
# unless the dispatch sets override_manual_traffic (see
# .github/scripts/deploy_decide.sh).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_manual_traffic:
        description: Deploy even when traffic was moved by hand off the revision of a commit with the target's image inputs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Same reasoning as deploy-dev.yml: every deploy mutates the same service
  # and jobs, a run stopped mid-way leaves them on different images, and a
  # queued dispatch must not be cancelled by the next one.
  group: deploy-production
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      # A push or workflow_run has no inputs, so this is false there.
      override_manual_traffic: ${{ inputs.override_manual_traffic == true }}
    # deploy.yml reads WIF_PROVIDER and WIF_SA from its own environment.
    secrets: inherit
